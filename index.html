function priceHistory(s) {
  if (s.source === 'manual') return `<p class="small muted" style="margin:8px 0 0">You added this yourself, so we only know what you told us: ${eur(s.cents)} / ${s.cycle === 'yearly' ? 'year' : 'month'}.</p>`;
  if (!s.priceHistory) return `<p class="small" style="margin:8px 0 0">Free trial since ${monthYear(s.since)}. ${s.status === 'active' && s.trial ? `Becomes ${eur(s.cents)} a month on ${fmtShort(s.next)}.` : `${eur(s.cents)} a month after the trial.`}</p>`;
  const h = s.priceHistory;
  if (h.length === 1) return `<p class="small" style="margin:8px 0 0">${eur(h[0].cents)} since ${monthYear(h[0].from)} — no price changes.</p>`;
  const rows = h.map((p, i) => {
    const until = h[i + 1] ? monthYear(addMonths(h[i + 1].from + '-01', -1).slice(0, 7)) : 'now';
    const diff = i > 0 ? p.cents - h[i - 1].cents : 0;
    return `<li><span>${monthYear(p.from)} – ${until}</span><span class="num"><strong>${eur(p.cents)}</strong>${diff > 0 ? ` <span class="pill gold">+${eur(diff)}</span>` : ''}</span></li>`;
  }).reverse();
  return `${sparkline(s)}<ul class="ph">${rows.join('')}</ul>`;
}

/* A small step chart of the price over the last 12 months */
function sparkline(s) {
  const pts = [];
  for (let i = 11; i >= 0; i--) {
    const ym = addMonths(state.today, -i).slice(0, 7);
    let c = null;
    s.priceHistory.forEach(p => { if (p.from <= ym) c = p.cents; });
    if (c !== null) pts.push({ ym, c });
  }
  if (pts.length < 2) return '';
  const W = 300, H = 70;
  const min = Math.min(...pts.map(p => p.c)), max = Math.max(...pts.map(p => p.c));
  const x = i => 10 + i * (W - 20) / (pts.length - 1);
  const y = c => max === min ? H / 2 : H - 18 - (c - min) / (max - min) * (H - 40);
  let d = `M${x(0)},${y(pts[0].c)}`;
  pts.forEach((p, i) => { if (i) d += ` H${x(i)} V${y(p.c)}`; });
  const ch = pts.findIndex((p, i) => i > 0 && p.c > pts[i - 1].c);
  const label = pts.map(p => p.c).filter((c, i, a) => i === 0 || c !== a[i - 1]).map(eur).join(' then ');
  return `
    <svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Price over the last 12 months: ${label}">
      <path d="${d}" fill="none" style="stroke:var(--forest-2)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${ch > 0 ? `
        <circle cx="${x(ch)}" cy="${y(pts[ch].c)}" r="5.5" style="fill:var(--gold)" stroke="#fff" stroke-width="2"/>
        <text x="${x(ch)}" y="${y(pts[ch].c) - 10}" text-anchor="middle" font-size="11" font-weight="700" style="fill:var(--gold-ink)">+${eur(pts[ch].c - pts[ch - 1].c)}</text>` : ''}
      <text x="10" y="${H - 2}" font-size="10" style="fill:var(--slate)">${monthYear(pts[0].ym)}</text>
      <text x="${W - 10}" y="${H - 2}" font-size="10" text-anchor="end" style="fill:var(--slate)">${monthYear(pts[pts.length - 1].ym)}</text>
    </svg>`;
}

/* Guess-your-total: a slider, then the real number counts up from the guess */
function renderGuess() {
  const real = detectedTotal();
  if (!ui.guessRevealed) return `
    <p class="eyebrow">Before we start</p>
    <h2 class="sheet-title">How much do you think you pay for subscriptions <em>each month?</em></h2>
    <p class="guess-val" id="guessVal" aria-hidden="true">€${ui.guess}</p>
    <input type="range" class="range" id="guessRange" min="0" max="150" step="1" value="${ui.guess}"
      aria-label="Your guess, euros per month" aria-valuetext="€${ui.guess} a month" data-autofocus>
    <div class="range-scale" aria-hidden="true"><span>€0</span><span>€150</span></div>
    <p class="tiny muted" style="text-align:center">Drag, then let go.</p>
    <button class="btn btn-gold btn-block mt" data-action="guessReveal">Show me the real number</button>
    <button class="btn btn-ghost btn-block mt" data-action="closeSheet">Skip</button>`;
  const diff = real - ui.guess * 100;
  return `
    <p class="eyebrow">You guessed €${ui.guess}</p>
    <h2 class="sheet-title">Your bank can see</h2>
    <p class="guess-real"><span id="guessReal">${eur(real)}</span><small>/ month</small></p>
    <p style="margin:0">${diff > 0 ? `That's <strong>${eur(diff)} more</strong> than you thought — ${eur(real * 12)} a year.`
                       : diff < 0 ? `A little less than you guessed — ${eur(real * 12)} a year.` : 'Spot on.'}</p>
    <div class="banner warn">
      <span class="b-ico">${icon('help', 18)}</span>
      <div class="grow"><h3 class="banner-h" style="font-size:19px">And that's only what your bank can see.</h3>
        <p>App store payments and family plans can hide more. We'll show you where.</p></div>
    </div>

}
function revealGuess() {
  if (ui.guessRevealed) return;
  ui.guessRevealed = true;

  const el = document.getElementById('guessReal');
  if (el) countUp(el, ui.guess * 100, detectedTotal());
}

/* ===== 6c. ADD WHAT THE BANK CAN'T SEE — a guided 3-step flow ===== */
function newDraft(fromLump) {
  const lump = fromLump ? openLump() : null;
  return {
    step: 1,
    lumpId: lump ? lump.id : null,
    pick: null, customName: '',
    channel: lump ? lump.channel : null,
    amount: lump ? (lump.cents / 100).toFixed(2) : '',
    cycle: 'monthly',
    next: lump ? lump.next : addMonths(state.today, 1),
  };
}
function draftName(d) {
  const p = PRESETS.find(x => x.id === d.pick);
  return p ? p.name : d.customName.trim();
}
function stepValid(d) {
  if (d.step === 1) return !!d.pick && (d.pick !== 'custom' || d.customName.trim().length > 0);
  if (d.step === 2) return !!d.channel;
  return parseAmount(d.amount) !== null && !!d.next && d.next >= state.today;
}
function draftPreview(d) {
  const c = parseAmount(d.amount);
  if (c === null) return 'Enter an amount to see the yearly cost.';
  return d.cycle === 'yearly' ? `${eur(Math.round(c / 12))} a month · ${eur(c)} a year` : `${eur(c)} a month · ${eur(c * 12)} a year`;
}

          <span class="logo blank" aria-hidden="true">${icon('plus', 18)}</span>
          <span class="opt-main"><b>Something else</b><small>Type the name yourself</small></span>

      ['appstore', 'App store', "Paid through your phone's app store"],
      ['googleplay', 'Google Play', 'Paid through the Play store'],
      ['paypal', 'PayPal', 'An automatic PayPal payment'],
      ['family', 'Family plan', 'Someone else pays — you share it'],
      ['other', 'Other', 'Anything else'],
    ];
    body = `
      <h1 class="h-title" tabindex="-1">How is <em>${esc(draftName(d))}</em> billed?</h1>
      <p class="lead">This tells us where you'd stop it, if you ever want to.</p>
      <div role="group" aria-label="Billing channel">
        ${opts.map(([v, l, h]) => `
          <button class="opt" data-action="addChannel" data-value="${v}" aria-pressed="${d.channel === v}">
            <span class="opt-main"><b>${l}</b><small>${h}${lump && v === lump.channel ? ' · matches your statement' : ''}</small></span>
            <span class="tick">${icon('check', 14)}</span>
          </button>`).join('')}
      </div>`;
  }

  if (d.step === 3) {
    const bad = d.amount !== '' && parseAmount(d.amount) === null;
    body = `
      <h1 class="h-title" tabindex="-1">How much, and <em>how often?</em></h1>
      <p class="lead">${lump ? 'We filled this in from your statement — change it if it looks wrong.' : 'Check a receipt or the app if you are not sure.'}</p>
      <div class="field">
        <label for="amount">Amount</label>
        <div class="money"><span aria-hidden="true">€</span>

      </div>

/* Pick the notification to show: ghost charge > confirmation > upcoming charge */
function buildLockNote(newAlerts) {
  const ghost = newAlerts.find(a => a.type === 'ghost');
  if (ghost) {
    const s = findSub(ghost.subId);
    return { title: `${esc(s.name)} charged ${eur(ghost.cents)} after you stopped it.`, body: 'Tap to see what you can do.', target: null };
  }
  const conf = newAlerts.filter(a => a.type === 'confirmed');
  if (conf.length) {
    const s = findSub(conf[0].subId);
    const more = conf.length > 1 ? ` (+${conf.length - 1} more)` : '';
    return { title: `No charge from ${esc(s.name)}${more}.`, body: `It worked. You kept ${eur(conf[0].monthly)} this month — ${eur(conf[0].monthly * 12)} a year.`, target: null };
  }
  const soon = state.subs
    .filter(s => s.status === 'active' && daysBetween(state.today, s.next) <= warnWindow(s) && daysBetween(state.today, s.next) >= 0)
    .sort((a, b) => a.next.localeCompare(b.next))[0];
  if (soon) {
    const title = soon.trial
      ? `${esc(soon.name)} free trial ends ${relDays(soon.next)} — then ${eur(soon.cents)}.`
      : `${esc(soon.name)}, ${eur(soon.cents)} — charges ${relDays(soon.next)}.`;
    return { title, body: `Tap to review it before ${weekday(soon.next)}.`, target: soon.id };
  }
  return null;
}

/* ---------------------------------------------------------------------
   7. SHEETS AND TOASTS
   --------------------------------------------------------------------- */
let sheetReturnFocus = null;
function openSheet(html, label) {
  sheetReturnFocus = document.activeElement;
  els.sheet.innerHTML = `
    <div class="sheet-layer">
      <div class="sheet-backdrop" data-action="closeSheet"></div>
      <div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(label)}">
        <div class="grabber" aria-hidden="true"></div>
        <button class="icon-btn sheet-close" data-action="closeSheet" aria-label="Close">${icon('x')}</button>
        ${html}
      </div>
    </div>`;
  syncInert();
  const t = els.sheet.querySelector('[data-autofocus]') || els.sheet.querySelector('h2');
  if (t) { if (!t.hasAttribute('tabindex') && t.tagName === 'H2') t.setAttribute('tabindex', '-1'); t.focus({ preventScroll: true }); }
}
/* Swap what an open sheet shows (e.g. guess -> reveal, dispute -> confirmation) */
function setSheetContent(html) {
  const sheet = els.sheet.querySelector('.sheet');
  if (!sheet) return;
  sheet.innerHTML = `<div class="grabber" aria-hidden="true"></div>
    <button class="icon-btn sheet-close" data-action="closeSheet" aria-label="Close">${icon('x')}</button>${html}`;
  const t = sheet.querySelector('[data-autofocus]');
  if (t) t.focus({ preventScroll: true });
}
function closeSheet(restoreFocus = true) {
  if (!els.sheet.innerHTML) return;
  els.sheet.innerHTML = '';
  syncInert();
  if (restoreFocus && sheetReturnFocus && document.contains(sheetReturnFocus)) sheetReturnFocus.focus({ preventScroll: true });
}
/* While a sheet or overlay is open, the bank app underneath can't be tabbed into */
function syncInert() {
  const sheetOn = !!els.sheet.innerHTML;
  els.shell.inert = sheetOn || els.overlay.classList.contains('on');
  els.overlay.inert = sheetOn;
}

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  els.toast.appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 240); }, 3200);
}

/* The exit guide: deadline, route, effort, and the official page */
function renderExitGuide(s) {
  const ch = CHANNELS[s.channel];
  const n = daysBetween(state.today, s.next);
  const deadline = addDays(s.next, -1);
  const what = s.trial ? `first ${eur(s.cents)} charge` : `${eur(s.cents)} charge`;
  const deadlineText = n <= 1
    ? `Stop it <strong>today</strong> to avoid ${n === 0 ? "today's" : "tomorrow's"} ${what}.`
    : `Stop before <strong>${fmtLong(deadline)}</strong> to avoid ${weekday(s.next)}'s ${what}.`;
  return `
    <p class="eyebrow">Stop ${esc(s.name)}</p>
    <h2 class="sheet-title">Stop it <em>before</em> ${n <= 1 ? 'it charges' : weekday(s.next)}.</h2>
    <div class="deadline" role="note">${icon('clock')}<span>${deadlineText}</span></div>

    <h3 class="mini-h">Where it's managed</h3>
    <p class="small" style="margin:0 0 8px">${ch.where(esc(s.name))}</p>
    <div class="crumbs" aria-label="Route">${ch.route(s.name).map(x => `<span>${esc(x)}</span>`).join('<i aria-hidden="true">›</i>')}</div>

    <div class="meta-row">${icon('clock', 18)}<span>Takes <strong>${ch.effort}</strong>.</span></div>
    <div class="meta-row">${icon('check', 18)}<span>You usually keep access until <strong>${fmtShort(deadline)}</strong> — the end of the period you've already paid for.</span></div>
    <div class="meta-row">${icon('shield', 18)}<span>On ${fmtShort(s.next)} we'll check that no charge arrives, and tell you.</span></div>

    <button class="btn btn-gold btn-block mt" data-action="openCancel" data-id="${s.id}" data-autofocus>Open cancellation page ${icon('external', 18)}</button>
    <p class="fine" style="margin-top:8px">Opens ${esc(s.name)}'s official page. We never cancel anything for you.</p>
    <button class="btn btn-ghost btn-block mt" data-action="closeSheet">Not now</button>`;
}

/* The bank's own dispute flow, reached from a ghost charge */
function renderDispute(a) {
  const s = findSub(a.subId);
  if (a.disputeRef) return `
    <p class="eyebrow">Dispute opened</p>
    <h2 class="sheet-title">We've <em>got it</em> from here.</h2>
    <div class="banner ok"><span class="b-ico">${icon('check')}</span><div class="grow">
      <p style="margin:0"><strong>Reference ${a.disputeRef}</strong></p>
      <p>We'll update you within 10 banking days. You don't need to do anything else.</p></div></div>
    <button class="btn btn-gold btn-block mt" data-action="closeSheet" data-autofocus>Done</button>`;
  return `
    <p class="eyebrow">${BANK.name} · dispute a charge</p>
    <h2 class="sheet-title">This charge <em>shouldn't</em> be here.</h2>
    <div class="stmt"><span>${s.name.toUpperCase().replace(/\s+/g, '')}*MEMBERSHIP</span><span>${eurFi(a.cents)}</span><span>${fmtStmt(a.date)}</span></div>
    <ul class="bullets">
      <li>You stopped ${esc(s.name)} on ${fmtShort(s.stoppedOn)}.</li>
      <li>We confirmed no charge on ${fmtShort(s.confirmedOn)}.</li>
      <li>${eur(a.cents)} arrived on ${fmtShort(a.date)} anyway.</li>
    </ul>
    <p class="small">Contacting ${esc(s.name)} first is often fastest. If that doesn't work, we can dispute it with the card network for you.</p>
    <button class="btn btn-gold btn-block mt" data-action="disputeConfirm" data-id="${a.id}" data-autofocus>Start a dispute</button>
    <button class="btn btn-ghost btn-block mt" data-action="closeSheet">Not now</button>`;
}

/* ---------------------------------------------------------------------
   8. ACTIONS — every data-action="…" maps to a function here
   --------------------------------------------------------------------- */
const actions = {
  /* --- lock screen --- */
  openNotification() {
    const target = ui.lockNote && ui.lockNote.target;
    ui.lockOn = false;
    els.overlay.classList.remove('on');   // hide the lock at once, before the route change renders
    syncInert();
    if (target) showScreen('detail', target);
    else refresh({ focusTitle: true });
  },
  skipLock() { ui.lockOn = false; refresh({ focusTitle: true }); },

  /* --- bank shell (inert on purpose) --- */
  inert(d) { toast(`${d.label || 'That'} isn't part of this prototype — only the ${feat()} tab works here.`); },
  tab(d) {
    if (d.value !== 'mohar') return toast(`${d.label} isn't part of this prototype — only the ${feat()} tab works here.`);
    if (currentRoute().name === 'hub') els.screen.scrollTo({ top: 0, behavior: reduceMotion() ? 'auto' : 'smooth' });
    else goHome();
  },

  /* --- navigation --- */
  open(d) { closeSheet(false); showScreen('detail', d.id); },
  back() { goBack('hub'); },
  toggleBreakdown() { ui.breakdownOpen = !ui.breakdownOpen; refresh(); },

  /* --- detail: usage check-in and the three decisions --- */
  usage(d) { findSub(d.id).usage = d.value; refresh(); },
  keep(d) {
    const s = findSub(d.id);
    s.decision = 'keep'; s.remindOn = null;
    toast(`Keeping ${s.name}. We'll still warn you before each charge.`);
    goBack('hub');
  },
  unsure(d) {
    const s = findSub(d.id);
    const dayBefore = addDays(s.next, -1);
    s.decision = 'unsure';
    s.remindOn = dayBefore < state.today ? state.today : dayBefore;
    toast(`We'll remind you on ${fmtShort(s.remindOn)}, the day before it charges.`);
    goBack('hub');
  },
  stop(d) { const s = findSub(d.id); openSheet(renderExitGuide(s), `How to stop ${s.name}`); },
  undoStop(d) {
    const s = findSub(d.id);
    Object.assign(s, { status: 'active', decision: null, stoppedOn: null, checkOn: null });
    refresh();
    toast(`${s.name} is active again.`);
  },
  removeSub(d) {
    const s = findSub(d.id);
    state.subs = state.subs.filter(x => x.id !== s.id);
    state.unknown.forEach(u => { if (u.resolvedTo === s.id) { u.resolved = false; u.resolvedTo = null; } });
    toast(`${s.name} removed from your list.`);
    goBack('hub');
  },

  /* --- exit guide -> provider's page -> back to the bank --- */
  closeSheet() { closeSheet(); },
  openCancel(d) { closeSheet(false); ui.cancelStep = 0; showScreen('cancel', d.id); },
  provStep(d) { ui.cancelStep = Number(d.step); refresh({ focusTitle: true }); },
  provUpsell() { toast('Upgrades are not part of this prototype.'); },
  provClose(d) {
    if (ui.cancelStep === 2) return actions.provDone(d);
    goBack('detail', d.id);
    toast('Nothing changed. You can come back to this any time.');
  },
  provDone(d) {
    const s = findSub(d.id);
    Object.assign(s, { status: 'stopping', decision: 'stop', remindOn: null, stoppedOn: state.today, checkOn: s.next });
    goBack('detail', d.id);
    toast(`Marked as stopping — we'll check on ${fmtDM(s.checkOn)}.`);
  },

  /* --- add what the bank can't see --- */
  addStart(d) { closeSheet(false); ui.addDraft = newDraft(d.from === 'lump'); showScreen('add'); },
  addPick(d) {
    ui.addDraft.pick = d.value;
    refresh();
    if (d.value === 'custom') { const inp = document.getElementById('customName'); if (inp) inp.focus(); }
  },
  addChannel(d) { ui.addDraft.channel = d.value; refresh(); },
  addCycle(d) { ui.addDraft.cycle = d.value; refresh(); },
  addNext() { if (stepValid(ui.addDraft)) { ui.addDraft.step++; refresh({ focusTitle: true }); els.screen.scrollTop = 0; } },
  addBack() {
    if (ui.addDraft && ui.addDraft.step > 1) { ui.addDraft.step--; refresh({ focusTitle: true }); }
    else { ui.addDraft = null; goBack('hub'); }
  },
  addSave() {
    const d = ui.addDraft;
    if (!stepValid(d)) return;
    const preset = PRESETS.find(p => p.id === d.pick);
    let id = preset ? preset.id : 'custom-' + (++ui.seq);
    while (findSub(id)) id += '-' + (++ui.seq);
    const lump = d.lumpId ? state.unknown.find(u => u.id === d.lumpId) : null;
    state.subs.push(Object.assign({}, SUB_DEFAULTS, {
      id, name: draftName(d),
      category: preset ? preset.category : 'Added by you',
      color: preset ? preset.color : '#55606B', group: preset ? preset.group : null, lastOpenedDays: null,
      cents: parseAmount(d.amount), cycle: d.cycle, channel: d.channel, source: 'manual',
      next: d.next, since: null, lastOpened: null, priceHistory: null,
      paid2026: lump ? lump.paid2026 : null,
    }));
    if (lump) { lump.resolved = true; lump.resolvedTo = id; }
    ui.addDraft = null;
    goBack('hub');   // the hub re-renders and the total counts up to the new figure
    toast(`${draftName(d) || 'Subscription'} added — your total is now ${eur(totalMonthly())} a month.`);
  },

  /* --- alerts --- */
  dismissAlert(d) { findAlert(d.id).dismissed = true; refresh(); },
  dispute(d) { openSheet(renderDispute(findAlert(d.id)), 'Dispute a charge'); },
  disputeConfirm(d) {
    const a = findAlert(d.id);
    a.disputeRef = BANK.code + '-' + a.date.replace(/-/g, '').slice(2) + '-07';
    refresh();
    setSheetContent(renderDispute(a));
  },

  /* --- Tier 2: monthly/yearly, guess, recognition, rejoin --- */
  setPeriod(d) { ui.period = d.value; refresh(); },
  guessReveal() { revealGuess(); },
  replayGuess() { ui.guessRevealed = false; openSheet(renderGuess(), 'Guess your total'); },
  toggleRecog(d) { ui.recogOpen[d.id] = !ui.recogOpen[d.id]; refresh(); },
  rename(d) {
    const s = findSub(d.id);
    openSheet(`
      <p class="eyebrow">Rename</p>
      <h2 class="sheet-title">What should we <em>call</em> it?</h2>
      <div class="field"><label for="renameInput">Name</label>
        <input class="input" id="renameInput" value="${esc(s.name)}" maxlength="40" autocomplete="off" data-enter="renameSave" data-autofocus></div>
      <button class="btn btn-gold btn-block mt" data-action="renameSave" data-id="${s.id}">Save name</button>`, 'Rename subscription');
  },
  renameSave(d) {

/* Advance the demo clock by one calendar month and process every charge in between */
function fastForward() {
  closeSheet(false);
  closeDemoOverlay();
  ui.addDraft = null;
  const from = state.today, to = addMonths(from, 1), fresh = [];

  state.subs.forEach(s => {
    s.nudgeLater = false;   // "ask me later" means: ask again next month
    let guard = 0;
    while (s.next > from && s.next <= to && guard++ < 24) processCharge(s, s.next, fresh);
  });
  state.unknown.forEach(u => {
    while (u.next > from && u.next <= to) {
      if (u.next.startsWith('2026')) u.paid2026 += u.cents;
      u.last = u.next; u.next = addMonths(u.next, 1);
    }
  });

  state.today = to;
  ui.clockStart = Date.now();
  ui.taskIndex = 2;
  ui.lockNote = buildLockNote(fresh);
  ui.lockOn = !!ui.lockNote;
  refresh();
  goHome();
  toast(`Jumped ahead to ${fmtFull(to)}.`);
}

/* What happens to one subscription on its charge date */
function processCharge(s, date, fresh) {
  if (s.status === 'stopping') {
    /* the charge did NOT arrive: confirm it */
    s.status = 'stopped'; s.confirmedOn = date;
    state.savedCents += s.cents;
    fresh.push(addAlert({ type: 'confirmed', subId: s.id, date, monthly: monthly(s) }));
    if (s.ghostAfterStop) s.ghostArmed = true;
  } else if (s.status === 'stopped') {
    /* normally nothing — except the demo's ghost charge */
    if (s.ghostArmed) {
      s.ghostArmed = false;
      if (date.startsWith('2026')) s.paid2026 += s.cents;
      const a = addAlert({ type: 'ghost', subId: s.id, date, cents: s.cents });
      s.ghost = { date, cents: s.cents, alert: a.id };
      fresh.push(a);
    } else {
      state.savedCents += s.cents;   // another month it didn't charge
    }
  } else {
    /* an ordinary charge */
    if (date.startsWith('2026') && s.paid2026 !== null) s.paid2026 += s.cents;
    s.trial = false;
    if (s.decision === 'unsure') s.decision = null;
    s.remindOn = null;
  }
  s.next = addMonths(date, cycleMonths(s));
}
function addAlert(a) { a.id = 'a' + (++ui.seq); state.alerts.unshift(a); return a; }

/* Single-series bar chart: one colour, rounded tops, hover/focus tooltip, recessive grid */
function barChart(rows) {
  const W = 640, H = 240, L = 48, R = 12, T = 16, B = 30;
  const max = 20000, ticks = [0, 10000, 20000];
  const slot = (W - L - R) / rows.length, bw = Math.min(56, slot - 18), r = 4;
  const y = v => T + (H - T - B) * (1 - v / max);
  const bars = rows.map(([m, v], i) => {
    const x = L + i * slot + (slot - bw) / 2, top = y(v), base = y(0);
    const d = `M${x},${base} V${top + r} Q${x},${top} ${x + r},${top} H${x + bw - r} Q${x + bw},${top} ${x + bw},${top + r} V${base} Z`;
    const last = i === rows.length - 1;
    return `
      <g class="bar" tabindex="0" role="img" aria-label="${m} 2026: ${v.toLocaleString('en-GB')} customers" data-tip="${m} 2026 · ${v.toLocaleString('en-GB')} customers" data-x="${(x + bw / 2) / W * 100}" data-y="${top / H * 100}">
        <rect x="${L + i * slot}" y="${T}" width="${slot}" height="${H - T - B}" fill="transparent"/>
        <path d="${d}" style="fill:var(--bank)"/>
        ${last ? `<text x="${x + bw / 2}" y="${top - 6}" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--ink)">${(v / 1000).toFixed(1)}k</text>` : ''}
        <text x="${x + bw / 2}" y="${H - 10}" text-anchor="middle" font-size="12" style="fill:var(--slate)">${m}</text>
      </g>`;
  }).join('');
  const grid = ticks.map(t => `
    <line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" style="stroke:var(--line)" stroke-width="1"/>
    <text x="${L - 8}" y="${y(t) + 4}" text-anchor="end" font-size="11" style="fill:var(--slate)">${t ? t / 1000 + 'k' : '0'}</text>`).join('');
  return `
    <div class="chart">
      <svg viewBox="0 0 ${W} ${H}" class="chart-svg" aria-label="Bar chart of monthly feature opens">${grid}${bars}</svg>
      <div class="chart-tip" id="chartTip" hidden></div>
    </div>`;
}

function showChartTip(g) {
  const tip = document.getElementById('chartTip');
  if (!tip) return;
  tip.textContent = g.dataset.tip;
  tip.style.left = g.dataset.x + '%';
  tip.style.top = g.dataset.y + '%';
  tip.hidden = false;
}
document.addEventListener('mouseover', e => { const g = e.target.closest && e.target.closest('.bar'); if (g) showChartTip(g); });
document.addEventListener('focusin',   e => { const g = e.target.closest && e.target.closest('.bar'); if (g) showChartTip(g); });
document.addEventListener('mouseout',  e => { if (e.target.closest && e.target.closest('.bar')) { const t = document.getElementById('chartTip'); if (t) t.hidden = true; } });

/* ---------------------------------------------------------------------
   9g. CHARGE-DAY CALENDAR — a month grid with charges and the allowance day.
   Observation only: it counts, it doesn't advise.
   --------------------------------------------------------------------- */
function chargesBetween(from, to) {
  const out = [];
  state.subs.filter(s => s.status === 'active').forEach(s => {
    for (let d = s.next; d <= to; d = addMonths(d, cycleMonths(s))) if (d >= from) out.push({ date: d, name: s.name, cents: s.cents, id: s.id });
  });
  state.unknown.filter(u => !u.resolved).forEach(u => {
    for (let d = u.next; d <= to; d = addMonths(d, 1)) if (d >= from) out.push({ date: d, name: u.label, cents: u.cents, id: null });
  });
  return out.sort((a, b) => a.date.localeCompare(b.date));
}

function renderCalendar() {
  const base = toDate(state.today);
  const first = new Date(base.getFullYear(), base.getMonth() + ui.calMonth, 1);
  const y = first.getFullYear(), m = first.getMonth();
  const daysIn = new Date(y, m + 1, 0).getDate();
  const endIso = toISO(new Date(y, m, daysIn));
  const byDay = {};
  chargesBetween(toISO(first), endIso).filter(c => c.date >= state.today).forEach(c => { (byDay[c.date] = byDay[c.date] || []).push(c); });

  const income = nextIncome();
  const before = chargesBetween(state.today, addDays(income, -1));
  const beforeSum = before.reduce((a, c) => a + c.cents, 0);
  const selected = ui.calDay || Object.keys(byDay).sort()[0] || null;
  const wds = ui.lang === 'fi' ? ['ma', 'ti', 'ke', 'to', 'pe', 'la', 'su'] : ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  const offset = (first.getDay() + 6) % 7;   // weeks start on Monday

  let cells = '';
  for (let i = 0; i < offset; i++) cells += '<span class="cal-blank" aria-hidden="true"></span>';
  for (let d = 1; d <= daysIn; d++) {
    const iso = toISO(new Date(y, m, d));
    const list = byDay[iso] || [];
    const isIncome = d === state.incomeDay;
    const cls = ['cal-day', iso < state.today ? 'past' : '', iso === state.today ? 'today' : '', list.length ? 'has' : '', isIncome ? 'income' : ''].join(' ');
    const label = `${fmtShort(iso)}${iso === state.today ? ', today' : ''}${isIncome ? ', ' + state.incomeLabel : ''}${list.length ? ': ' + list.map(c => `${c.name} ${eur(c.cents)}`).join(', ') : ''}`;
    cells += `<button class="${cls}" data-action="calDay" data-value="${iso}" aria-pressed="${selected === iso}" aria-label="${esc(label)}">
        <span>${d}</span>${list.length ? `<span class="cd-dots" aria-hidden="true">${list.map(() => '<i></i>').join('')}</span><span class="cd-amt" aria-hidden="true">${eurShort(list.reduce((a, c) => a + c.cents, 0))}</span>` : ''}
      </button>`;
  }

  const sel = selected ? (byDay[selected] || []) : [];
  const selIncome = selected && toDate(selected).getDate() === state.incomeDay;
  return `
    <button class="back" data-action="back">${icon('back')} ${t('back')}</button>
    <h1 class="h-title" tabindex="-1">${t('calTitle')}</h1>

    <section class="banner soft" aria-label="Before your next income">
      <span class="b-ico">${icon('calendar', 18)}</span>
      <div class="grow">
        <h2 class="banner-h"><em>${before.length}</em> charge${before.length === 1 ? '' : 's'} land before your next income.</h2>
        <p>${eur(beforeSum)} in total before your ${state.incomeLabel} arrives on ${fmtShort(income)}. Your balance today is ${eur(state.balanceCents)}.</p>
      </div>
    </section>

    <div class="cal-nav">
      <button class="icon-btn" data-action="calMonth" data-value="${ui.calMonth - 1}" aria-label="Previous month" ${ui.calMonth <= 0 ? 'disabled' : ''}>${icon('back')}</button>
      <h2 class="card-title" aria-live="polite">${ui.lang === 'fi' ? MO_FI[m] + 'kuu' : MO[m]} ${y}</h2>
      <button class="icon-btn" data-action="calMonth" data-value="${ui.calMonth + 1}" aria-label="Next month" ${ui.calMonth >= 2 ? 'disabled' : ''}>${icon('chev')}</button>
    </div>
    <div class="cal-grid">
      ${wds.map(w => `<span class="cal-wd" aria-hidden="true">${w}</span>`).join('')}
      ${cells}
    </div>
    <div class="cal-legend" aria-hidden="true">
      <span><i class="lg-charge"></i>Charge</span><span><i class="lg-income"></i>${state.incomeLabel[0].toUpperCase() + state.incomeLabel.slice(1)}</span><span><i class="lg-today"></i>Today</span>
    </div>

    <section class="card" aria-live="polite">
      ${selected ? `
        <h2 class="card-title">${fmtLong(selected)}</h2>
        ${selIncome ? `<p class="small" style="margin:6px 0 0"><span class="pill moss">${icon('coin', 12)} ${state.incomeLabel} arrives</span></p>` : ''}
        ${sel.length ? `<ul class="list">${sel.map(c => `
          <li><button class="sub-row" ${c.id ? `data-action="open" data-id="${c.id}"` : 'data-action="addStart" data-from="lump"'}>
            <span class="sub-main"><span class="sub-name">${esc(c.name)}</span><span class="sub-meta">${relDays(c.date)}</span></span>
            <span class="sub-amt">${eur(c.cents)}</span></button></li>`).join('')}</ul>`
          : `<p class="empty">No charges on this day.</p>`}`
        : `<p class="empty">No charges left this month.</p>`}
    </section>`;
}

/* ---------------------------------------------------------------------
   9h. MONTHLY CHECK-UP — one big card per subscription: Keep / Not sure / Stop.
   Buttons work everywhere; on touch screens you can also swipe (right keep, left stop).
   --------------------------------------------------------------------- */
function startCheckup() {
  const queue = state.subs.filter(s => s.status === 'active').sort((a, b) => a.next.localeCompare(b.next)).map(s => s.id);
  ui.checkup = { queue, i: 0, results: {}, start: Date.now(), end: null };
}

function renderCheckup() {
  if (!ui.checkup) startCheckup();
  const c = ui.checkup;
  const head = `<div class="add-top"><button class="back" data-action="back">${icon('back')} ${t('back')}</button>
    <span class="muted small">${Math.min(c.i + 1, c.queue.length)} / ${c.queue.length}</span></div>
    <div class="steps" aria-hidden="true">${c.queue.map((_, k) => `<i class="${k < c.i || (k === c.i && c.i < c.queue.length) ? 'on' : ''}"></i>`).join('')}</div>`;

  if (!c.queue.length) return `${head}<h1 class="h-title" tabindex="-1">${t('checkupTitle')}</h1><p class="empty">Nothing to review — no active subscriptions.</p>`;

  if (c.i >= c.queue.length) {
    const r = Object.values(c.results);
    const n = r.length, k = r.filter(x => x === 'keep').length, u = r.filter(x => x === 'unsure').length, st = r.filter(x => x === 'stop').length;
    const secs = Math.max(1, Math.round((c.end - c.start) / 1000));
    const stops = Object.keys(c.results).filter(id => c.results[id] === 'stop').map(findSub).filter(s => s && s.status === 'active');
    return `${head}
      <h1 class="h-title" tabindex="-1">Check-up <em>done</em></h1>
      <p class="cu-sum">You reviewed ${n} subscription${n === 1 ? '' : 's'} in ${secs} seconds — keeping ${k}, reviewing ${u}, stopping ${st}.</p>
      ${stops.length ? `
        <section class="card">
          <h2 class="card-title">Ready to stop</h2>
          <p class="tiny muted" style="margin:2px 0 6px">We'll show you the way out and the deadline. Nothing is cancelled until you do it.</p>
          ${stops.map(s => `<button class="btn btn-gold btn-block mt" data-action="cuStop" data-id="${s.id}">Stop ${esc(s.name)} ${icon('chev', 18)}</button>`).join('')}
        </section>` : ''}
      ${u ? `<p class="small muted">We'll remind you the day before each “not sure” charges.</p>` : ''}
      <button class="btn btn-ghost btn-block mt" data-action="back">Back to ${t('back').toLowerCase()}</button>
      <p class="fine"><button class="link-btn" data-action="restartCheckup">Start the check-up again</button></p>`;
  }

  const s = findSub(c.queue[c.i]);
  const z = zombie(s), rise = priceRise(s);
  const insight = z ? z.text
    : s.trial ? `Free trial — becomes ${eur(s.cents)} a month on ${fmtShort(s.next)}.`
    : rise ? `The price went up ${eur(rise.diff)} in ${rise.month}.`
    : s.lastOpened ? `Last opened ${s.lastOpened}.`
    : 'Added by you.';
  return `${head}
    <h1 class="h-title" tabindex="-1">${t('checkupTitle')}</h1>
    <div class="cu-card" id="cuCard" data-id="${s.id}">
      <span class="cu-stamp keep" aria-hidden="true">${t('keep')}</span><span class="cu-stamp stop" aria-hidden="true">${t('stop')}</span>
      ${logo(s)}
      <h2 class="cu-name">${esc(s.name)}</h2>
      <p class="cu-amt">${eur(monthly(s))}<small>/ ${t('month')}</small></p>
      <p class="cu-next">${s.trial ? t('trialEnds') : t('nextCharge')} ${fmtShort(s.next)} · ${relDays(s.next)}</p>
      <p class="cu-insight">${insight}</p>
    </div>
    <div class="decide">
      <button class="decide-btn" data-action="cuDecide" data-value="keep"><span class="d-ico">${icon('check')}</span>${t('keep')}</button>
      <button class="decide-btn" data-action="cuDecide" data-value="unsure"><span class="d-ico">${icon('help')}</span>${t('unsure')}</button>
      <button class="decide-btn" data-action="cuDecide" data-value="stop"><span class="d-ico">${icon('exit')}</span>${t('stop')}</button>
    </div>
    <p class="fine">On a touch screen you can swipe: right to keep, left to stop.</p>`;
}

function checkupDecide(value) {
  const c = ui.checkup;
  if (!c || c.i >= c.queue.length || c.busy) return;
  const s = findSub(c.queue[c.i]);
  c.results[s.id] = value;
  if (value === 'keep') { s.decision = 'keep'; s.remindOn = null; }
  if (value === 'unsure') {
    const dayBefore = addDays(s.next, -1);
    s.decision = 'unsure';
    s.remindOn = dayBefore < state.today ? state.today : dayBefore;
  }
  const next = () => {
    c.busy = false;
    c.i++;
    if (c.i >= c.queue.length) c.end = Date.now();
    refresh({ focusTitle: true });
  };
  const card = document.getElementById('cuCard');
  if (card && !reduceMotion()) {
    c.busy = true;
    card.style.transform = '';
    card.classList.add(value === 'keep' ? 'fly-right' : value === 'stop' ? 'fly-left' : 'fly-up');
    setTimeout(next, 240);
  } else next();
}

/* Touch swipe on the check-up card */
let swipe = null;
document.addEventListener('pointerdown', e => {
  const card = e.target.closest && e.target.closest('#cuCard');
  if (!card || e.pointerType === 'mouse') return;
  swipe = { card, x: e.clientX, dx: 0, id: e.pointerId };
  card.setPointerCapture(e.pointerId);
  card.style.transition = 'none';
});
document.addEventListener('pointermove', e => {
  if (!swipe || e.pointerId !== swipe.id) return;
  swipe.dx = e.clientX - swipe.x;
  swipe.card.style.transform = `translateX(${swipe.dx}px) rotate(${swipe.dx / 22}deg)`;
  swipe.card.dataset.lean = swipe.dx > 50 ? 'keep' : swipe.dx < -50 ? 'stop' : '';
});
function endSwipe(e) {
  if (!swipe || e.pointerId !== swipe.id) return;
  const { card, dx } = swipe;
  swipe = null;
  card.style.transition = '';
  card.dataset.lean = '';
  if (Math.abs(dx) > 90) checkupDecide(dx > 0 ? 'keep' : 'stop');
  else card.style.transform = '';
}
document.addEventListener('pointerup', endSwipe);
document.addEventListener('pointercancel', endSwipe);

/* ---------------------------------------------------------------------
   9i. YEAR IN REVIEW — one shareable-looking card
   --------------------------------------------------------------------- */
function renderReview() {
  const all = state.subs.filter(s => s.status !== 'notsub');
  const lumpPaid = state.unknown.filter(u => !u.resolved).reduce((a, u) => a + u.paid2026, 0);
  const total = all.reduce((a, s) => a + (s.paid2026 || 0), 0) + lumpPaid;
  const biggest = all.filter(s => s.paid2026).sort((a, b) => b.paid2026 - a.paid2026)[0];
  const unused = s => s.usage === 'no' ? 999 : s.usage === 'yes' ? -1 : (s.lastOpenedDays == null ? -2 : s.lastOpenedDays);
  const least = all.slice().sort((a, b) => unused(b) - unused(a))[0];
  const stoppedN = all.filter(s => s.status === 'stopped').length;
  const manualN = all.filter(s => s.source === 'manual').length;
  return `
    <button class="back" data-action="back">${icon('back')} ${t('back')}</button>
    <h1 class="h-title" tabindex="-1">${t('reviewTitle')}</h1>
    <article class="yir" aria-label="Your 2026 in subscriptions">
      <div class="yir-top"><span>${bankLogo(24)} ${BANK.name}</span><span>2026</span></div>
      <p class="yir-kicker">Your year in subscriptions</p>
      <p class="yir-big">${eur(total)}</p>
      <p class="yir-sub">paid for subscriptions so far in 2026${lumpPaid ? ` — including ${eur(lumpPaid)} in app store payments you haven't named yet` : ''}</p>
      <dl class="yir-grid">
        <div><dt>Biggest</dt><dd>${biggest ? esc(biggest.name) : '—'}</dd><span>${biggest ? eur(biggest.paid2026) + ' this year' : ''}</span></div>
        <div><dt>Used least</dt><dd>${least ? esc(least.name) : '—'}</dd><span>${least ? (least.usage === 'no' ? "you said you didn't use it" : least.lastOpened ? 'last opened ' + least.lastOpened : '') : ''}</span></div>
        <div><dt>Saved so far</dt><dd>${eur(state.savedCents)}</dd><span>${state.savedCents ? `by stopping ${stoppedN}` : 'stop one and this starts counting'}</span></div>
        <div><dt>Tracked</dt><dd>${all.length}</dd><span>subscriptions${manualN ? `, ${manualN} added by you` : ''}</span></div>
      </dl>
    </article>
    <button class="btn btn-gold btn-block mt" data-action="share">Share my year</button>
    <p class="fine">Figures come from your ${BANK.name} statements and what you added yourself.</p>`;
}

/* ---------------------------------------------------------------------
   10. BOOT
   --------------------------------------------------------------------- */
function boot() {
  ['app', 'shell', 'screen', 'overlay', 'tabbar', 'demo', 'taskNum', 'taskText', 'taskHint', 'taskDone',
   'taskPrev', 'taskNext', 'demoDate', 'ffTo'].forEach(id => { els[id] = document.getElementById(id); });
  els.sheet = document.getElementById('sheetRoot');
  els.toast = document.getElementById('toastRoot');
  els.fab = document.getElementById('demoFab');

  /* Static pieces of the bank shell */
  document.getElementById('demoMark').innerHTML = moharMark(32);
  document.getElementById('sbIcons').innerHTML = statusIcons;
  document.getElementById('bellBtn').innerHTML = icon('bell', 22);
  document.querySelector('.demo-x').innerHTML = icon('x');
  els.page = document.getElementById('page');
  els.stage = document.querySelector('.stage');
  applyTheme(BANK.id);

  els.viewBtns = document.getElementById('viewBtns');
  document.body.classList.add('view-laptop');
  fitDevice();
  /* Re-render when the window crosses between one and two columns */
  let wasWide = null;
  window.addEventListener('resize', () => {
    fitDevice();
    const wide = isWide();
    if (wasWide !== null && wide !== wasWide) refresh();
    wasWide = wide;
  });
  /* The phone frame clips its content; never let focus or keyboard scrolling shift it */
  els.app.addEventListener('scroll', () => { els.app.scrollTop = 0; els.app.scrollLeft = 0; });

  /* Always start fresh on the hub route, with the lock screen on top */
  nav.stack = ['#/hub'];
  if (location.hash !== '#/hub') location.replace('#/hub');
  ui.lockNote = buildLockNote([]);
  render({ nav: true });
}
boot();
</script>
