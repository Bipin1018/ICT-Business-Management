<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mohar — subscription feature prototype</title>
<meta name="description" content="Interactive prototype of Mohar, a white-label subscription feature embedded in a bank's mobile app. University artefact — all banks, services and figures are fictional.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23C9A227'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%230E3B2E' stroke-width='1.5' stroke-dasharray='1.5 1.8'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%230E3B2E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">

<style>
/* =====================================================================
   1. DESIGN TOKENS
   The brief's tokens are used exactly. Three helpers are added:
   --gold-ink   gold darkened so it passes WCAG AA as small text
   --danger-wash  background for ghost-charge warnings
   --bank*      the white-label bank shell colours (themeable later)
   ===================================================================== */
:root{
  --cream:#F5F8F5;      /* app background: a clean, faintly green white */
  --cream-2:#EAF0EB;    /* secondary surface */
  --forest:#0B4F33;     /* primary brand: banknote green */
  --forest-2:#136B45;
  --moss:#1E8A55;       /* positive / success */
  --mint:#E2F2E7;       /* positive wash */
  --gold:#C9A03A;       /* accent: CTAs, key numbers, warnings (coin gold) */
  --gold-lite:#EBD592;
  --gold-wash:#FBF3DD;  /* warning wash */
  --ink:#13221A;        /* text */
  --slate:#566760;      /* secondary text */
  --line:#DCE5DE;       /* borders */
  --danger:#C2412D;     /* use sparingly: ghost charges only */

  --gold-ink:#7A5E0A;
  --danger-wash:#FBE9E4;
  --paper:#FFFFFF;
  --bank:#0B4F33;
  --bank-2:#136B45;
  --bank-ink:#FBF8F1;
  --bank-wash:#E2F2E7;

  --ease:cubic-bezier(.2,.8,.3,1);
  --serif:'Manrope', 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;   /* headings and amounts */
  --sans:'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;               /* all other text */
  --mono:ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--cream-2);color:var(--ink);font:400 16px/1.5 var(--sans);font-feature-settings:'tnum' 1,'cv11' 1;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--forest-2);outline-offset:2px}
[tabindex="-1"]:focus{outline:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.i{flex:none;display:block}

/* =====================================================================
   2. STAGE: demo controls + phone frame (desktop ≥ 900px)
   ===================================================================== */
.stage{min-height:100%;display:flex;align-items:flex-start;justify-content:center;gap:40px;padding:24px}
.device-wrap{flex:none;width:calc(410px * var(--s,1));height:calc(864px * var(--s,1))}
.device{position:relative;width:410px;height:864px;padding:10px;background:#1B211E;border-radius:50px;
  box-shadow:0 40px 80px -30px rgba(14,59,46,.45),0 0 0 1px rgba(0,0,0,.25);transform:scale(var(--s,1));transform-origin:top left}
.island{position:absolute;top:21px;left:50%;width:106px;height:30px;margin-left:-53px;background:#000;border-radius:999px;z-index:80;pointer-events:none}
.app{position:relative;width:100%;height:100%;border-radius:40px;overflow:hidden;background:var(--cream);isolation:isolate}
.shell{position:absolute;inset:0;display:flex;flex-direction:column}

/* Bank status bar + header (the host bank app, not Mohar) */
.statusbar{flex:none;height:48px;display:flex;align-items:center;justify-content:space-between;padding:4px 30px 0 34px;
  background:var(--bank);color:var(--bank-ink);font:700 14px var(--sans)}
.statusbar .sb-icons{display:flex;gap:6px;align-items:center}
.bankbar{flex:none;display:flex;align-items:center;gap:10px;padding:6px 14px 14px 16px;background:var(--bank);color:var(--bank-ink)}
.bank-name{font:800 16px var(--sans);letter-spacing:-.01em;flex:1}
.icon-btn{width:44px;height:44px;border:0;border-radius:999px;background:transparent;display:grid;place-items:center;color:inherit}
.icon-btn:hover{background:rgba(0,0,0,.06)}
.bankbar .icon-btn:hover{background:rgba(255,255,255,.1)}
.avatar{width:36px;height:36px;margin:4px;border:0;border-radius:50%;background:var(--bank-2);color:var(--bank-ink);font:700 14px var(--sans)}

.screen{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;overscroll-behavior:contain}
.view{padding:18px 16px 36px}
.view.enter-fwd{animation:inFwd 300ms var(--ease)}
.view.enter-back{animation:inBack 300ms var(--ease)}

/* Bottom tabs: only the Mohar tab works */
.tabbar{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:var(--paper);border-top:1px solid var(--line);padding:6px 6px 20px}
.tab{min-height:52px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font:600 11px var(--sans);color:var(--slate);border-radius:14px}
.tab .tab-ico{display:grid;place-items:center;width:52px;height:28px;border-radius:999px;transition:background 200ms var(--ease)}
.tab[aria-current="page"]{color:var(--bank)}
.tab[aria-current="page"] .tab-ico{background:var(--bank-wash)}

/* =====================================================================
   3. TYPE + COMMON COMPONENTS
   ===================================================================== */
.eyebrow{margin:0;font:700 12px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--slate)}
.h-title{margin:4px 0 6px;letter-spacing:-.02em;font:700 27px/1.05 var(--serif);letter-spacing:-.01em}
.h-title em,.banner-h em,.sheet-title em,.h-sub em,.pg-title em,.cu-sum em{font-style:normal;color:var(--forest-2)}
.h-sub{margin:4px 0 6px;font:700 21px/1.15 var(--serif)}
.lead{margin:0;color:var(--slate);font-size:14px}
.muted{color:var(--slate)}
.small{font-size:14px}
.tiny{font-size:13px}
.grow{flex:1;min-width:0}
.mt{margin-top:16px}
.num{font-variant-numeric:tabular-nums}

.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:16px;box-shadow:0 1px 2px rgba(19,34,26,.04)}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.card-title{margin:0;font:700 17px var(--serif);letter-spacing:-.01em}
.mini-h{margin:18px 0 6px;font:700 13px var(--sans);letter-spacing:.02em}

.btn{min-height:48px;padding:0 22px;border-radius:999px;border:1.5px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font:700 15px var(--sans);text-decoration:none;transition:transform 180ms var(--ease),background 180ms var(--ease)}
.btn:active{transform:scale(.98)}
.btn-block{width:100%}
.btn-gold{background:var(--gold);color:var(--ink)}
.btn-gold:hover{background:#D4AE35}
.btn-gold:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{background:var(--cream-2)}
.btn-danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn-sm{min-height:44px;padding:0 16px;font-size:14px}
.link-btn{border:0;background:none;padding:10px 4px;min-height:44px;font-weight:700;color:var(--forest-2);text-decoration:underline;text-underline-offset:3px}

.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font:600 12px/1.35 var(--sans);background:var(--cream-2);color:var(--slate);white-space:nowrap}
.pill.gold{background:var(--gold-wash);color:var(--gold-ink)}
.pill.moss{background:var(--mint);color:var(--forest-2)}
.pill.danger{background:var(--danger-wash);color:var(--danger)}

.logo{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;font:800 17px var(--sans)}

/* Banners: confirmations (ok), reminders (warn), ghost charges (bad) */
.banner{display:flex;gap:12px;align-items:flex-start;border-radius:14px;padding:14px 12px 14px 14px;margin-top:14px}
.banner.ok{background:var(--mint)}
.banner.warn{background:var(--gold-wash)}
.banner.bad{background:var(--danger-wash)}
.banner .b-ico{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--moss)}
.banner.warn .b-ico{background:var(--gold);color:var(--ink)}
.banner.bad .b-ico{background:var(--danger)}
.banner-h{margin:2px 0 0;font:700 18px/1.15 var(--serif)}
.banner p{margin:4px 0 0;font-size:13.5px}
.banner .icon-btn{margin:-8px -6px 0 0}
.banner .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pop{animation:pop 320ms var(--ease)}

/* =====================================================================
   4. HUB: timeline, total, list
   ===================================================================== */
.timeline{list-style:none;margin:8px -6px 0;padding:0}
.tl-row{width:100%;display:grid;grid-template-columns:40px 14px 1fr auto;gap:10px;align-items:center;padding:8px 8px;min-height:58px;
  border:0;border-radius:12px;background:none;text-align:left}
.tl-row:hover{background:var(--cream)}
.tl-date{text-align:center;line-height:1}
.tl-date span{display:block;font:700 9.5px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--slate)}
.tl-date b{display:block;font:700 21px/1 var(--serif);margin:1px 0}
.rail{position:relative;align-self:stretch;display:flex;align-items:center;justify-content:center}
.rail::before{content:"";position:absolute;left:50%;top:-10px;bottom:-10px;width:2px;margin-left:-1px;background:var(--line)}
.timeline li:first-child .rail::before{top:50%}
.timeline li:last-child .rail::before{bottom:50%}
.timeline li:only-child .rail::before{display:none}
.dot{position:relative;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid #9AA8A1}
.tl-name{display:block;font-weight:700;line-height:1.25}
.tl-meta{display:block;font-size:13px;color:var(--slate)}
.tl-amt{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.tl-row.urgent{background:var(--gold-wash)}
.tl-row.urgent .dot{background:var(--gold);border-color:var(--gold)}
.tl-row.urgent .tl-meta{color:var(--gold-ink);font-weight:600}
.tl-row.is-stopping .tl-amt{text-decoration:line-through;color:var(--slate)}
.tl-row.is-stopping .dot{background:var(--mint);border-color:var(--moss)}
.tl-row.reminder .dot{border-style:dashed;border-color:var(--gold)}
.tl-row.unknown .dot{border-color:var(--gold);border-style:dotted}
.tl-row.unknown .tl-name{font-family:var(--mono);font-size:13px;letter-spacing:.02em}
.empty{padding:18px 4px;color:var(--slate);text-align:center}

.total{margin-top:14px;border-radius:14px;padding:18px;background:var(--forest);color:var(--cream)}
.total-btn{display:block;width:100%;padding:0;border:0;background:none;color:inherit;text-align:left;border-radius:10px}
.total-btn:focus-visible{outline-color:var(--gold-lite);outline-offset:6px}
.total .eyebrow{color:#BFD3C8}
.total-num{display:block;margin:10px 0 2px;font:800 42px/1 var(--serif);color:var(--gold);font-variant-numeric:tabular-nums}
.total-num small{font:500 15px var(--sans);color:#D8E4DD;margin-left:4px}
.total-sub{display:block;color:#D8E4DD;font-size:13.5px}
.segbar{display:flex;gap:2px;height:10px;margin:14px 0 10px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.08)}
.seg{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:#E7EEE9}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i,.bd-head i{display:inline-block;width:9px;height:9px;border-radius:50%}
.expand{display:inline-flex;align-items:center;gap:4px;margin-top:12px;font-weight:700;font-size:13px;color:var(--gold-lite)}
.expand .i{transition:transform 220ms var(--ease)}
.total-btn[aria-expanded="true"] .expand .i{transform:rotate(180deg)}
.breakdown{margin-top:12px;animation:fade 220ms var(--ease)}
.bd-group{padding:10px 0;border-top:1px solid rgba(255,255,255,.12)}
.bd-head{display:flex;justify-content:space-between;font-weight:700;font-size:13.5px}
.bd-head span:first-child{display:inline-flex;align-items:center;gap:8px}
.bd-row{display:flex;justify-content:space-between;gap:8px;padding:4px 0 0 17px;font-size:13px;color:#D8E4DD}
.bd-row small{color:#A9BFB3}
.honesty{margin:14px 0 0;padding-top:12px;border-top:1px solid rgba(255,255,255,.14);font-size:12.5px;color:#C9D9D0}

.lump{margin-top:14px;padding:16px;border:1.5px dashed var(--gold);border-radius:14px;background:var(--gold-wash)}
.lump .eyebrow{color:var(--gold-ink)}
.lump p{margin:0 0 4px}
.stmt{display:flex;justify-content:space-between;gap:10px;margin:10px 0 12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);
  font:500 12.5px var(--mono);font-variant-numeric:tabular-nums}

/* Savings meter */
.savings{margin-top:14px;padding:16px;border-radius:14px;background:var(--cream-2)}
.savings.has{background:var(--mint)}
.sv-head{display:flex;align-items:center;gap:8px}
.sv-head .eyebrow{color:var(--forest-2)}
.sv-coin{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:var(--ink)}
.sv-big{margin:12px 0 0;font:800 33px/1 var(--serif);color:var(--forest);font-variant-numeric:tabular-nums}
.sv-big small{margin-left:6px;font:600 13px var(--sans);color:var(--forest-2)}
.sv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid rgba(23,84,63,.15)}
.sv-grid b{display:block;font:700 19px/1 var(--serif);color:var(--forest)}
.sv-grid small{display:block;margin-top:3px;font-size:11.5px;font-weight:600;color:var(--forest-2)}
.sv-empty{margin:8px 0 0;font-size:13px;color:var(--slate)}

/* Monthly ↔ yearly toggle */
.top-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.segctl.period{display:inline-flex;padding:3px}
.segctl.period button{flex:none;min-height:44px;padding:0 13px;font-size:13px}

/* Softer, informational banners (overlap, zombie, annual note) and the bank-only tag */
.banner.soft{background:var(--cream-2)}
.banner.soft .b-ico{background:var(--forest-2)}
.banner p.bank-only{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font:800 10.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--gold-ink)}

/* Trial radar: its own warning style — hatched gold, with a ring showing how much of the trial is used */
.radar{display:flex;gap:14px;align-items:center;margin-top:14px;padding:16px 14px;border:2px dashed var(--gold);border-radius:14px;
  background:repeating-linear-gradient(135deg,var(--gold-wash) 0 12px,#FDF7E6 12px 24px)}
.radar .eyebrow{display:flex;align-items:center;gap:5px;color:var(--gold-ink)}
.radar-ring{flex:none;display:grid;place-items:center;width:76px;height:76px;border-radius:50%;
  background:conic-gradient(var(--gold) calc(var(--p) * 1%), var(--gold-lite) 0)}
.radar-ring span{display:grid;place-items:center;align-content:center;width:60px;height:60px;border-radius:50%;background:var(--paper);font:700 20px/1 var(--serif)}
.radar-ring small{font:800 9px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--slate)}
.radar-h{margin:4px 0 0;font:700 14px var(--sans)}
.radar-count{margin:2px 0 6px;font:700 21px var(--mono);color:var(--gold-ink);font-variant-numeric:tabular-nums}

/* Price sparkline */
.spark{display:block;width:100%;height:auto;margin-top:10px}

/* How we recognised this */
.recog-btn{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:44px;padding:0;border:0;background:none;font:700 15px var(--sans);text-align:left}
.recog-btn .i{transition:transform 220ms var(--ease)}
.recog-btn[aria-expanded="true"] .i{transform:rotate(180deg)}
.recog{animation:fade 220ms var(--ease)}
.stmt-list{list-style:none;margin:8px 0 0;padding:0;font:500 12px var(--mono)}
.stmt-list li{display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:center;margin-top:6px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--cream)}
.stmt-list .st{min-width:0;overflow-wrap:anywhere}
.stmt-list small{display:block;color:var(--slate);font-size:11px}
.stmt-list .mk{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--cream-2);color:var(--slate)}
.stmt-list .mk.ok{background:var(--mint);color:var(--moss)}
.stmt-list .excl{background:var(--paper);border-style:dashed;color:var(--slate)}
.merge{display:flex;align-items:center;gap:8px;margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--mint);color:var(--forest-2);font-weight:700;font-size:13.5px}
.recog-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}

/* Stopped list rows carry a Rejoin button */
.stopped-li{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.stopped-li .sub-row{border-bottom:0;min-width:0;flex:1}
.list .stopped-li:last-child{border-bottom:0}

/* Guess your total */
.guess-val{margin:18px 0 4px;text-align:center;font:800 50px/1 var(--serif);font-variant-numeric:tabular-nums}
.range{display:block;width:100%;height:44px;margin:0;accent-color:var(--forest)}
.range-scale{display:flex;justify-content:space-between;font-size:12px;color:var(--slate)}
.guess-real{margin:8px 0 8px;font:800 50px/1 var(--serif);color:var(--forest);font-variant-numeric:tabular-nums}
.guess-real small{margin-left:6px;font:500 15px var(--sans);color:var(--slate)}

.list{list-style:none;margin:6px 0 0;padding:0}
.sub-row{width:100%;display:flex;align-items:center;gap:12px;min-height:66px;padding:10px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.list li:last-child .sub-row{border-bottom:0}
.sub-row:hover .sub-name{text-decoration:underline;text-underline-offset:3px}
.sub-main{flex:1;min-width:0}
.sub-name{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-weight:700}
.sub-meta{display:block;font-size:13.5px;color:var(--slate);margin-top:1px}
.sub-amt{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.sub-amt small{display:block;font-weight:500;font-size:11.5px;color:var(--slate)}
.list.stopped .logo{filter:grayscale(1);opacity:.55}
.list.stopped .sub-amt{color:var(--slate);text-decoration:line-through}

.fine{margin:18px 6px 0;font-size:12px;color:var(--slate);text-align:center}

/* =====================================================================
   5. DETAIL SCREEN
   ===================================================================== */
.back{display:inline-flex;align-items:center;gap:2px;min-height:44px;padding:0 12px 0 2px;margin-left:-6px;border:0;border-radius:999px;background:none;font-weight:700;color:var(--forest-2)}
.back:hover{background:var(--cream-2)}
.d-hero{display:flex;gap:14px;align-items:center;margin-top:6px}
.d-hero .logo{width:58px;height:58px;border-radius:17px;font-size:25px}
.d-hero .h-title{margin:0 0 4px;font-size:32px}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.d-amt{margin-top:20px;font:800 44px/1 var(--serif);font-variant-numeric:tabular-nums}
.d-amt small{font:500 15px var(--sans);color:var(--slate);margin-left:4px}
.d-sub{margin:6px 0 0;color:var(--slate);font-size:14px}
.next-chip{display:inline-flex;align-items:center;gap:7px;margin-top:12px;padding:8px 13px;border-radius:999px;background:var(--cream-2);font-weight:700;font-size:13.5px}
.next-chip.urgent{background:var(--gold-wash);color:var(--gold-ink);box-shadow:inset 0 0 0 1px var(--gold-lite)}
.next-chip.calm{background:var(--mint);color:var(--forest-2)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;margin:0}
.facts dt{font-size:12px;color:var(--slate)}
.facts dd{margin:2px 0 0;font-weight:700}
.ph{list-style:none;margin:8px 0 0;padding:0}
.ph li{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
.ph li:first-child{border-top:0}
.choices{display:flex;gap:8px;margin-top:10px}
.choice{flex:1;min-height:44px;border:1.5px solid var(--line);border-radius:999px;background:var(--paper);font-weight:700;font-size:14px}
.choice[aria-pressed="true"]{background:var(--forest);border-color:var(--forest);color:var(--cream)}
.decide{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.decide-btn{display:flex;flex-direction:column;align-items:center;gap:6px;min-height:96px;padding:14px 6px;border:1.5px solid var(--line);border-radius:14px;background:var(--paper);font-weight:800;font-size:14.5px}
.decide-btn:hover{border-color:var(--forest-2)}
.decide-btn .d-ico{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--cream-2);color:var(--forest)}
.decide-btn small{font-weight:500;font-size:11.5px;line-height:1.3;color:var(--slate);text-align:center}
.decide-btn[aria-pressed="true"]{border-color:var(--forest);box-shadow:inset 0 0 0 1px var(--forest);background:#F7FBF8}

/* =====================================================================
   6. ADD FLOW
   ===================================================================== */
.add-top{display:flex;align-items:center;justify-content:space-between}
.steps{display:flex;gap:6px;margin:6px 0 16px}
.steps i{flex:1;height:4px;border-radius:99px;background:var(--line);transition:background 240ms var(--ease)}
.steps i.on{background:var(--forest)}
.stmt-card{margin-bottom:14px;padding:14px;border-radius:14px;background:var(--cream-2)}
.stmt-card .stmt{margin:8px 0 6px}
.opt{width:100%;display:flex;align-items:center;gap:12px;min-height:62px;margin-top:8px;padding:10px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--paper);text-align:left}
.opt:hover{border-color:var(--forest-2)}
.opt[aria-pressed="true"]{border-color:var(--forest);box-shadow:inset 0 0 0 1px var(--forest);background:#F7FBF8}
.opt .opt-main{flex:1;min-width:0}
.opt b{display:block}
.opt small{display:block;color:var(--slate);font-size:12.5px}
.tick{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent}
.opt[aria-pressed="true"] .tick{background:var(--forest);border-color:var(--forest);color:#fff}
.opt .logo{width:36px;height:36px;border-radius:10px;font-size:15px}
.opt .logo.blank{background:var(--cream-2);color:var(--slate)}
.field label{display:block;margin:18px 0 6px;font-weight:700;font-size:13px}
.input{width:100%;min-height:50px;padding:0 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);font:600 16px var(--sans);color:var(--ink)}
.input:focus{border-color:var(--forest-2)}
.money{position:relative}
.money span{position:absolute;left:16px;top:50%;transform:translateY(-50%);font:700 24px var(--serif)}
.money .input{padding-left:36px;font:700 26px var(--serif);min-height:60px}
.segctl{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--cream-2)}
.segctl button{flex:1;min-height:44px;border:0;border-radius:999px;background:none;font-weight:700}
.segctl button[aria-pressed="true"]{background:var(--paper);box-shadow:0 1px 3px rgba(18,36,29,.15)}
.preview{margin:16px 0 0;padding:12px 14px;border-radius:12px;background:var(--mint);color:var(--forest-2);font-weight:700;font-size:14px}
.error{margin:6px 0 0;color:var(--danger);font-size:13px;font-weight:600}
.sticky-cta{position:sticky;bottom:-36px;margin:20px -16px -36px;padding:14px 16px 20px;background:linear-gradient(rgba(251,248,241,0),var(--cream) 28%)}

/* =====================================================================
   7. SHEETS, TOASTS, OVERLAYS
   ===================================================================== */
.sheet-layer{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end}
.sheet-backdrop{position:absolute;inset:0;background:rgba(18,36,29,.45);animation:fade 220ms var(--ease)}
.sheet{position:relative;max-height:90%;overflow-y:auto;padding:10px 20px 26px;border-radius:20px 20px 0 0;background:var(--cream);animation:sheetUp 320ms var(--ease)}
.grabber{width:40px;height:5px;margin:0 auto 10px;border-radius:99px;background:var(--line)}
.sheet-close{position:absolute;top:8px;right:8px}
.sheet-title{margin:6px 40px 0 0;font:700 23px/1.08 var(--serif)}
.deadline{display:flex;gap:10px;align-items:flex-start;margin:16px 0 4px;padding:14px;border-left:4px solid var(--gold);border-radius:12px;background:var(--gold-wash);font-weight:600;font-size:14.5px}
.deadline .i{color:var(--gold-ink);margin-top:1px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.crumbs span{padding:5px 9px;border:1px solid var(--line);border-radius:8px;background:var(--paper);font-size:13px;font-weight:700}
.crumbs i{font-style:normal;color:var(--slate)}
.meta-row{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:13.5px}
.meta-row .i{color:var(--forest-2);margin-top:1px}
.bullets{margin:10px 0 0;padding-left:18px;font-size:14px}
.bullets li{margin:4px 0}

.toast-root{position:absolute;left:12px;right:12px;bottom:96px;z-index:70;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{max-width:100%;padding:11px 16px;border-radius:14px;background:var(--forest);color:var(--cream);font-weight:600;font-size:13.5px;
  box-shadow:0 10px 30px -10px rgba(14,59,46,.6);animation:toastIn 260ms var(--ease)}
.toast.out{opacity:0;transform:translateY(6px);transition:all 220ms var(--ease)}

.overlay{position:absolute;inset:0;z-index:30;display:none}
.overlay.on{display:block}

/* Phone lock screen */
.lock{position:absolute;inset:0;overflow:hidden;color:#fff;background:#163F33}
.lock::before{content:"";position:absolute;inset:-60px;filter:blur(34px);
  background:
    radial-gradient(circle at 20% 22%, #3E8C69 0, transparent 42%),
    radial-gradient(circle at 85% 30%, #C9A227 0, transparent 34%),
    radial-gradient(circle at 70% 85%, #0E3B2E 0, transparent 50%),
    radial-gradient(circle at 15% 80%, #6FA88A 0, transparent 40%),
    linear-gradient(160deg,#1E5A45,#0E3B2E)}
.lock > *{position:relative}
.lock-status{display:flex;justify-content:space-between;align-items:center;height:48px;padding:4px 30px 0 34px;font:700 14px var(--sans)}
.lock-clock{text-align:center;margin-top:34px}
.lock-date{font:600 18px var(--sans);opacity:.92}
.lock-time{font:500 86px/1 var(--sans);letter-spacing:-.03em;margin-top:2px}
.lock-hint{margin:40px 0 8px;text-align:center;font-size:12.5px;font-weight:600;opacity:.85}
.notif{display:grid;grid-template-columns:38px 1fr;gap:10px;width:calc(100% - 24px);margin:0 12px;padding:12px 14px;border:0;border-radius:22px;text-align:left;
  background:rgba(251,248,241,.84);color:var(--ink);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  box-shadow:0 14px 34px -12px rgba(0,0,0,.45);animation:notifIn 520ms var(--ease) 250ms both}
.notif:hover{background:rgba(251,248,241,.95)}
.notif:focus-visible{outline-color:var(--gold-lite);outline-offset:3px}
.notif-icon{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--bank)}
.notif-app{display:flex;justify-content:space-between;font:700 11.5px var(--sans);letter-spacing:.04em;text-transform:uppercase;color:var(--slate)}
.notif-title{display:block;margin-top:2px;font-weight:700;font-size:14.5px;line-height:1.3}
.notif-body{display:block;font-size:13.5px;color:#33463D;margin-top:2px}
.lock-skip{position:absolute;left:0;right:0;bottom:42px;display:flex;justify-content:center}
.lock-skip button{min-height:44px;padding:0 18px;border:1px solid rgba(255,255,255,.4);border-radius:999px;background:rgba(255,255,255,.12);color:#fff;font-weight:700;font-size:14px}
.home-bar{position:absolute;left:50%;bottom:10px;width:130px;height:5px;margin-left:-65px;border-radius:99px;background:rgba(255,255,255,.85)}

/* Mock provider website (deliberately looks like a different company) */
.prov{position:absolute;inset:0;display:flex;flex-direction:column;background:#F5F5F7;color:#1C1C1E;font-family:var(--sans)}
.prov-chrome{display:flex;align-items:center;gap:8px;padding:52px 12px 10px;background:#E9E9EC;border-bottom:1px solid #D6D6DA}
.prov-close{min-height:44px;padding:0 10px;border:0;background:none;color:#0A58CA;font-weight:700}
.prov-url{flex:1;display:flex;align-items:center;gap:6px;min-width:0;padding:9px 11px;border-radius:10px;background:#fff;font-size:13px;color:#3A3A3C}
.prov-url span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prov-brand{display:flex;align-items:center;gap:10px;padding:14px 18px;background:#fff;border-bottom:1px solid #E5E5EA}
.prov-brand b{font-size:16px;letter-spacing:-.01em}
.prov-logo{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--pc);color:#fff;font-weight:800}
.prov-body{flex:1;overflow:auto;padding:22px 18px}
.prov-h{margin:0 0 6px;font:800 24px/1.2 var(--sans);letter-spacing:-.02em}
.prov-p{margin:0 0 16px;color:#48484A;font-size:14.5px}
.prov-card{margin-bottom:18px;padding:16px;border:1px solid #E5E5EA;border-radius:10px;background:#fff}
.prov-plan{display:flex;justify-content:space-between;gap:8px;font-size:15px}
.prov-dl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 0}
.prov-dl dt{font-size:12px;color:#6E6E73}
.prov-dl dd{margin:2px 0 0;font-weight:700;font-size:13.5px}
.prov-btn{width:100%;min-height:50px;margin-top:10px;border:0;border-radius:10px;background:var(--pc);color:#fff;font-weight:800;font-size:15px}
.prov-link{width:100%;min-height:50px;margin-top:10px;border:1.5px solid #C7C7CC;border-radius:10px;background:#fff;color:#1C1C1E;font-weight:700;font-size:15px}
.prov-done{display:grid;place-items:center;width:64px;height:64px;margin:10px 0 16px;border-radius:50%;background:#E8F5EC;color:#1E7B45}
.prov-ref{display:inline-block;margin-bottom:18px;padding:6px 10px;border-radius:8px;background:#EDEDF0;font:600 13px var(--mono)}
.prov-foot{padding:10px;text-align:center;font-size:11px;color:#8E8E93;border-top:1px solid #E5E5EA;background:#fff}

/* =====================================================================
   8. DEMO CONTROLS (scaffolding — deliberately not bank-app styling)
   ===================================================================== */
.demo{flex:none;position:sticky;top:24px;width:300px;padding:16px;border:1.5px dashed #B3A88E;border-radius:12px;background:var(--paper);font-size:13.5px}
.demo-head{display:flex;align-items:center;gap:10px}
.demo-head b{display:block;font:800 14px var(--sans)}
.demo-head small{display:block;font-size:11.5px;color:var(--slate);line-height:1.3}
.demo-x{display:none}
.tag{display:inline-block;padding:3px 6px;border-radius:4px;background:var(--ink);color:var(--cream);font:700 10px var(--mono);letter-spacing:.1em;text-transform:uppercase}
.task{margin-top:14px;padding:12px;border-radius:10px;background:var(--cream-2)}
.task-top{display:flex;justify-content:space-between;align-items:center}
.task-done{font:700 12px var(--mono);color:var(--moss)}
.task-q{margin:8px 0 4px;font:700 17px/1.22 var(--serif)}
.task-hint{margin:0 0 8px;font-size:12.5px;color:var(--slate)}
.task-nav{display:flex;gap:6px}
.demo-mini{flex:1;min-height:40px;border:1.5px solid var(--ink);border-radius:8px;background:var(--paper);font:700 12.5px var(--sans)}
.demo-mini.hot{background:var(--ink);color:var(--cream)}
.demo-mini:disabled{opacity:.35;cursor:not-allowed}
.demo-group{margin-top:16px}
.demo-label{font:700 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--slate)}
.demo-date{margin-top:4px;font:600 13px var(--mono)}
.demo-btn{width:100%;display:flex;align-items:center;gap:10px;min-height:48px;margin-top:8px;padding:6px 12px;border:1.5px solid var(--ink);border-radius:8px;background:var(--paper);text-align:left;font-weight:700}
.demo-btn small{display:block;font-weight:500;font-size:11.5px;color:var(--slate)}
.demo-btn .emo{font-size:18px;width:22px;text-align:center}
.demo-btn.primary{background:var(--ink);color:var(--cream)}
.demo-btn.primary small{color:#C9D5CF}
.demo-btn.reset{border-color:var(--danger);color:var(--danger);border-width:2px}
.demo-btn:disabled{opacity:.5;cursor:not-allowed;border-style:dashed}
.demo-note{margin:14px 0 0;font-size:11.5px;color:var(--slate)}
.demo-fab{display:none}

/* =====================================================================
   9. MOBILE (< 900px): app fills the screen, demo controls float
   ===================================================================== */
@media (max-width:899px){
  body{background:var(--cream)}
  .stage{display:block;padding:0}
  .device-wrap{width:100%;height:auto}
  .device{width:100%;height:100vh;height:100dvh;padding:0;border-radius:0;background:none;box-shadow:none;transform:none}
  .island,.statusbar,.lock-status{display:none}
  .app{border-radius:0}
  .lock-clock{margin-top:70px}
  .prov-chrome{padding-top:12px}
  .tabbar{padding-bottom:max(10px, env(safe-area-inset-bottom))}
  .demo{display:none;position:fixed;left:8px;right:8px;bottom:8px;top:auto;z-index:200;width:auto;max-height:82vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .demo.open{display:block}
  .demo-x{display:grid;margin-left:auto}
  /* The demo button takes the bell's place in the header so it never covers app content */
  #bellBtn{display:none}
  .demo-fab{display:flex;align-items:center;gap:6px;position:fixed;right:56px;top:10px;z-index:150;min-height:44px;padding:0 14px;
    border:1.5px dashed #B3A88E;border-radius:10px;background:var(--paper);font:700 13px var(--sans);box-shadow:0 6px 20px rgba(0,0,0,.15)}
}

/* =====================================================================
   9c. POLISH: tools, list controls, skeleton, calendar, check-up,
       year in review, settings
   ===================================================================== */
.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:14px}
.tool{display:flex;flex-direction:column;align-items:center;gap:5px;min-height:66px;padding:8px 2px;border:1px solid var(--line);border-radius:14px;background:var(--paper);font:700 11px/1.15 var(--sans);text-align:center}
.tool:hover{border-color:var(--forest-2)}
.tool-ico{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--bank-wash);color:var(--forest)}

.list-tools{display:flex;gap:8px;margin-top:10px}
.input.search{flex:1;min-width:0;min-height:44px;font-size:14px;font-weight:500}
.input.sort{flex:none;width:auto;max-width:44%;min-height:44px;padding:0 8px;font-size:13px}
.chips{display:flex;gap:6px;margin:8px -2px 0;padding:2px;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;min-height:40px;padding:0 13px;border:1.5px solid var(--line);border-radius:999px;background:var(--paper);font:700 12.5px var(--sans);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--forest);border-color:var(--forest);color:var(--cream)}
.list .empty{padding:16px 4px;font-size:13.5px}

.bell{display:inline-flex;align-items:center;gap:2px;margin-left:6px;padding:0 6px;border-radius:999px;background:var(--cream-2);font:700 10.5px/1.6 var(--sans);color:var(--slate);vertical-align:1px}
.tl-row.urgent .bell{background:rgba(255,255,255,.6);color:var(--gold-ink)}
.bell.off{opacity:.75}

/* First-load skeleton */
.sk{margin-top:14px;border-radius:14px;background:linear-gradient(90deg,var(--cream-2) 25%,#EEE6D4 50%,var(--cream-2) 75%);background-size:200% 100%;animation:shimmer 1.3s linear infinite}
.sk-dark{background:linear-gradient(90deg,var(--forest) 25%,var(--forest-2) 50%,var(--forest) 75%);background-size:200% 100%;opacity:.85}
.detect-steps{list-style:none;margin:14px 0 0;padding:0;font-size:13.5px}
.detect-steps li{display:flex;align-items:center;gap:8px;padding:4px 0;animation:fade 300ms var(--ease) both}
.detect-steps li:nth-child(2){animation-delay:.4s}
.detect-steps li:nth-child(3){animation-delay:.8s}
.detect-steps .i{color:var(--moss)}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}

/* Charge-day calendar */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-top:16px}
.cal-nav .icon-btn:disabled{opacity:.3;cursor:not-allowed}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px}
.cal-wd{padding:4px 0;text-align:center;font:700 10.5px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--slate)}
.cal-day{position:relative;display:flex;flex-direction:column;align-items:center;min-height:54px;padding:6px 0 4px;border:1px solid var(--line);border-radius:10px;background:var(--paper);font:700 13px var(--sans)}
.cal-day.past{opacity:.4}
.cal-day.today{border:2px solid var(--forest-2)}
.cal-day.has{background:var(--gold-wash);border-color:var(--gold-lite)}
.cal-day.income{background:var(--mint)}
.cal-day.income::after{content:"";position:absolute;top:5px;right:5px;width:7px;height:7px;transform:rotate(45deg);background:var(--moss)}
.cal-day[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--forest)}
.cd-dots{display:flex;gap:2px;margin-top:3px}
.cd-dots i{width:6px;height:6px;border-radius:50%;background:var(--gold)}
.cd-amt{margin-top:2px;font:700 9.5px var(--sans);color:var(--gold-ink)}
.cal-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--slate)}
.cal-legend span{display:inline-flex;align-items:center;gap:6px}
.cal-legend i{display:inline-block;width:10px;height:10px}
.lg-charge{border-radius:50%;background:var(--gold)}
.lg-income{transform:rotate(45deg);background:var(--moss)}
.lg-today{border:2px solid var(--forest-2);border-radius:3px}

/* Monthly check-up */
.cu-card{position:relative;margin-top:14px;padding:26px 20px 20px;border:1px solid var(--line);border-radius:20px;background:var(--paper);text-align:center;
  box-shadow:0 18px 40px -24px rgba(18,36,29,.4);touch-action:pan-y;user-select:none;transition:transform 240ms var(--ease),opacity 240ms var(--ease)}
.cu-card .logo{width:64px;height:64px;margin:0 auto;border-radius:18px;font-size:28px}
.cu-name{margin:14px 0 0;font:700 23px/1.1 var(--serif)}
.cu-amt{margin:8px 0 0;font:800 36px/1 var(--serif);font-variant-numeric:tabular-nums}
.cu-amt small{margin-left:4px;font:500 14px var(--sans);color:var(--slate)}
.cu-next{margin:10px 0 0;font-weight:700;font-size:13.5px;color:var(--slate)}
.cu-insight{margin:14px 0 0;padding:10px 12px;border-radius:12px;background:var(--cream-2);font-size:13.5px}
.cu-stamp{position:absolute;top:16px;padding:4px 10px;border:2px solid;border-radius:8px;font:800 13px var(--sans);letter-spacing:.08em;text-transform:uppercase;opacity:0;transition:opacity 150ms}
.cu-stamp.keep{left:16px;color:var(--moss);transform:rotate(-8deg)}
.cu-stamp.stop{right:16px;color:var(--gold-ink);transform:rotate(8deg)}
.cu-card[data-lean="keep"] .cu-stamp.keep,.cu-card[data-lean="stop"] .cu-stamp.stop{opacity:1}
.cu-card.fly-right{transform:translateX(120%) rotate(10deg);opacity:0}
.cu-card.fly-left{transform:translateX(-120%) rotate(-10deg);opacity:0}
.cu-card.fly-up{transform:translateY(-30%) scale(.94);opacity:0}
.cu-sum{margin:12px 0 0;font:700 20px/1.25 var(--serif)}

/* Year in review card */
.yir{position:relative;overflow:hidden;margin-top:14px;padding:22px 20px;border-radius:20px;background:linear-gradient(155deg,var(--bank-2),var(--bank));color:var(--cream);
  box-shadow:0 24px 50px -24px rgba(0,0,0,.45)}
.yir::before{content:"";position:absolute;right:-70px;top:-70px;width:210px;height:210px;border-radius:50%;border:26px solid rgba(201,162,39,.22)}
.yir > *{position:relative}
.yir-top{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13px}
.yir-top span{display:inline-flex;align-items:center;gap:8px}
.yir-kicker{margin:24px 0 0;font:700 19px/1.2 var(--serif)}
.yir-big{margin:6px 0 0;font:800 47px/1 var(--serif);color:var(--gold);font-variant-numeric:tabular-nums}
.yir-sub{margin:6px 0 0;font-size:13px;color:#D8E4DD}
.yir-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 14px;margin:22px 0 0;padding-top:18px;border-top:1px solid rgba(255,255,255,.2)}
.yir-grid dt{font:800 10.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--gold-lite)}
.yir-grid dd{margin:4px 0 0;font:700 19px/1.1 var(--serif)}
.yir-grid span{display:block;margin-top:3px;font-size:12px;color:#D2DED7}

/* Settings */
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch{flex:none;position:relative;width:58px;height:44px;padding:0;border:0;background:none}
.switch::before{content:"";position:absolute;left:3px;top:6px;width:52px;height:32px;border-radius:999px;background:#B3AB98;transition:background 200ms var(--ease)}

<script>
'use strict';
/* =======================================================================
   MOHAR PROTOTYPE — application script

   How it works, in one paragraph:
   There is ONE state object (`state`) holding subscriptions, the demo
   clock and every decision the user makes. Each screen is a function that
   reads `state` and returns an HTML string. After any change we call
   `refresh()`, which re-renders the current screen from state — so the
   numbers on screen can never disagree with the data. Buttons carry a
   `data-action` attribute; one click listener looks the action up in the
   `actions` object. Navigation uses the URL hash (#/hub, #/detail/x) so
   the browser back button works, from disk and on GitHub Pages.

   Sections
     1. Demo data
     2. State + derived values
     3. Date and money helpers
     4. Icons and small HTML helpers
     5. Router
     6. Screens  (hub, detail, add flow, provider page, lock screen)
     7. Sheets and toasts
     8. Actions  (what every button does)
     9. Demo harness (fast-forward, reset, tester tasks)
    10. Boot
   ======================================================================= */

/* ---------------------------------------------------------------------
   1. DEMO DATA
   All services are invented. Amounts are stored in CENTS (integers) so
   the totals are exact: 6895 + 1099 = 7994, never 79.94000001.
   --------------------------------------------------------------------- */
const DAY0 = '2026-11-03';   // Tuesday 3 November 2026

/* White-label banks. Each bank licenses the feature, names it itself and dresses it in its own colours.
   Mohar's own name and coin appear only in the demo chrome, the partner portal footer and the About page. */
const BANKS = [
  { id: 'saimaa',  name: 'Saimaa Bank',  feature: 'Subscriptions', featureFi: 'Tilaukset',   code: 'SB', logo: 'lake',   bank: '#0B4F33', bank2: '#136B45', wash: '#E2F2E7' },
  { id: 'virta',   name: 'Virta Pankki', feature: 'Recurring',     featureFi: 'Toistuvat',   code: 'VP', logo: 'stream', bank: '#0B3C6E', bank2: '#17548F', wash: '#E3EEF9' },
  { id: 'nordlys', name: 'Nordlys',      feature: 'Renewals',      featureFi: 'Uusiutuvat',  code: 'NL', logo: 'aurora', bank: '#3B2363', bank2: '#563782', wash: '#EEE8F7' },
  { id: 'koski',   name: 'Koski Bank',   feature: 'Regulars',      featureFi: 'Vakiomaksut', code: 'KB', logo: 'rapids', bank: '#7A2E17', bank2: '#963F1F', wash: '#F8E9E2' },
];
let BANK = BANKS[0];   // the bank currently shown; switched from the demo controls

/* Demo-only settings that survive Reset (the presenter's choice, not the tester's data) */
const demo = { page: null, view: 'laptop' };   // view: 'laptop' app or 'phone' frame (screens ≥ 900px)

/* Billing channels: label, where the subscription is managed, the exit
   route and an honest effort estimate. */
const CHANNELS = {
  card:       { label: 'Debit card',  effort: 'about 3 minutes',
                where: n => `Card subscriptions are stopped with ${n} directly, on their website or app.`,
                route: n => [n, 'Account', 'Subscription', 'Cancel'] },
  paypal:     { label: 'PayPal',      effort: 'about 2 minutes',
                where: n => `This one is paid through PayPal, so you can stop it there — or on ${n}'s own page.`,
                route: n => ['Settings', 'Payments', 'Automatic payments', n] },
  appstore:   { label: 'App store',   effort: 'about 1 minute',

  state.subs.filter(isLive).forEach(s => { sums[segmentOf(s)] += monthly(s); });
  return SEGMENTS.map(g => Object.assign({}, g, { cents: sums[g.key] })).filter(g => g.cents > 0);
}
function savings() {
  const stopped = state.subs.filter(s => s.status === 'stopped');

/* Price increase: the latest price is higher than the one before it */
function priceRise(s) {
  const h = s.priceHistory;
  if (!h || h.length < 2) return null;
  const last = h[h.length - 1], prev = h[h.length - 2];
  if (last.cents <= prev.cents) return null;
  return { diff: last.cents - prev.cents, month: MO[Number(last.from.slice(5, 7)) - 1] };
}

/* Zombie detection: paying for something that isn't used. The usage check-in can switch it on or off. */
function zombie(s) {
  if (s.status !== 'active' || s.usage === 'yes' || s.usage === 'little') return null;
  if (s.lastOpenedDays >= 45) {
    const since = addDays(state.today, -s.lastOpenedDays);
    let n = 0;
    for (let k = 1; k < 36; k++) {
      const d = addMonths(s.next, -k * cycleMonths(s));
      if (d <= since) break;
      if (d <= state.today) n++;
    }
    if (n) return { cents: n * s.cents, text: `You've paid ${eurShort(n * s.cents)} since you last opened this.` };
  }
  if (s.usage === 'no') return { cents: s.cents, text: `You said you didn't use it last month. That month cost ${eurShort(s.cents)}.` };
  return null;
}

/* Balance clash — only possible inside the bank: add up charges due before the next income
   and report the first one that takes the total past today's balance. Observation, not advice. */
function nextIncome() {
  const d = toDate(state.today);
  let inc = toISO(new Date(d.getFullYear(), d.getMonth(), state.incomeDay));
  if (inc <= state.today) inc = toISO(new Date(d.getFullYear(), d.getMonth() + 1, state.incomeDay));
  return inc;
}
function balanceClash() {
  const income = nextIncome();
  let due = 0;
  for (const it of timelineItems()) {
    if (it.date >= income) break;
    let cents = 0;
    if (it.kind === 'unknown') cents = it.lump.cents;
    else if ((it.kind === 'charge' || it.kind === 'trial') && it.sub.status === 'active') cents = it.sub.cents;
    if (!cents) continue;
    due += cents;
    if (due > state.balanceCents) return { item: it, cents, due, date: it.date, income, single: due === cents };
  }
  return null;
}

/* The raw bank-statement lines a detected subscription was built from */
function statementLines(s) {
  if (s.statement) return s.statement;
  const tag = s.name.toUpperCase().replace(/[^A-Z0-9]+/g, '');
  const variants = [`${tag}*SUBSCRIPTION`, `${tag}.COM`, `${tag} HELSINKI FI`];
  const n = s.cycle === 'yearly' ? 1 : 3;
  return Array.from({ length: n }, (_, i) => [variants[i], eurFi(s.cents), fmtStmt(addMonths(s.next, -(i + 1) * cycleMonths(s)))]);
}

function demoNow() {
  const d = toDate(state.today);
  d.setHours(9, 41, 0, 0);
  return d.getTime() + (Date.now() - ui.clockStart);
}
function countdownText(iso, short) {
  const ms = toDate(iso).getTime() - demoNow();
  if (ms <= 0) return 'now';
  const t = Math.floor(ms / 1000);
  const d = Math.floor(t / 86400), h = Math.floor(t % 86400 / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
  return short ? `${d}d ${h}h` : `${d}d ${pad(h)}h ${pad(m)}m ${pad(s)}s`;
}

/* ---------------------------------------------------------------------
   3. DATE AND MONEY HELPERS
   Dates are ISO strings ('2026-11-06') so they sort and compare simply.
   --------------------------------------------------------------------- */
const WD = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MO = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const WD_FI = ['su', 'ma', 'ti', 'ke', 'to', 'pe', 'la'];
const MO_FI = ['tammi', 'helmi', 'maalis', 'huhti', 'touko', 'kesä', 'heinä', 'elo', 'syys', 'loka', 'marras', 'joulu'];
const pad = n => String(n).padStart(2, '0');
const toDate = iso => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); };
const toISO  = dt => `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`;
const addDays = (iso, n) => { const d = toDate(iso); d.setDate(d.getDate() + n); return toISO(d); };
function addMonths(iso, n) {
  const d = toDate(iso), day = d.getDate();
  d.setDate(1); d.setMonth(d.getMonth() + n);
  const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(day, last));
  return toISO(d);
}
const daysBetween = (a, b) => Math.round((toDate(b) - toDate(a)) / 86400000);
const weekday  = iso => WD[toDate(iso).getDay()];
const fmtShort = iso => { const d = toDate(iso); return ui.lang === 'fi' ? `${WD_FI[d.getDay()]} ${d.getDate()}.${d.getMonth() + 1}.` : `${WD[d.getDay()].slice(0, 3)} ${d.getDate()} ${MO[d.getMonth()].slice(0, 3)}`; }; // Fri 6 Nov · pe 6.11.
const fmtLong  = iso => { const d = toDate(iso); return `${WD[d.getDay()]} ${d.getDate()} ${MO[d.getMonth()]}`; };                     // Friday 6 November
const fmtDM    = iso => { const d = toDate(iso); return ui.lang === 'fi' ? `${d.getDate()}.${d.getMonth() + 1}.` : `${d.getDate()} ${MO[d.getMonth()].slice(0, 3)}`; };                          // 6 Nov
const fmtFull  = iso => `${fmtShort(iso)} ${toDate(iso).getFullYear()}`;
const fmtStmt  = iso => { const d = toDate(iso); return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}`; };       // 06.11.2026
const monthYear = ym => { const [y, m] = ym.split('-').map(Number); return `${MO[m - 1].slice(0, 3)} ${y}`; };
function relDays(iso) {
  const n = daysBetween(state.today, iso), fi = ui.lang === 'fi';
  if (n === 0) return fi ? 'tänään' : 'today';
  if (n === 1) return fi ? 'huomenna' : 'tomorrow';
  if (n < 0)  return fi ? `${-n} päivää sitten` : `${-n} days ago`;
  return fi ? `${n} päivän päästä` : `in ${n} days`;
}

const eur   = cents => '€' + (cents / 100).toFixed(2);                      // €23.00
const eurFi = cents => '€' + (cents / 100).toFixed(2).replace('.', ',');     // €23,00 (statement style)
const eurShort = cents => cents % 100 ? eur(cents) : '€' + cents / 100;      // €46 when there are no cents
function parseAmount(str) {
  const n = Number(String(str).replace(',', '.').trim());
  if (!isFinite(n) || n <= 0 || n > 9999) return null;
  return Math.round(n * 100);
}

/* ---------------------------------------------------------------------
   5. ROUTER
   Hash routes: #/hub, #/detail/<id>, #/add, #/cancel/<id>
   `nav.stack` mirrors the browser history we created, so our own Back
   buttons can call history.back() and stay in sync with the browser's.
   The lock screen is an overlay flag (ui.lockOn), not a route.
   --------------------------------------------------------------------- */
const ROUTES = { hub: 1, detail: 2, add: 2, cancel: 3, calendar: 2, checkup: 2, review: 2, settings: 2 };   // value = depth, used for slide direction
const nav = { stack: [], lastHash: null, lastDepth: 1 };

function currentRoute() {
  const [name, param] = location.hash.replace(/^#\/?/, '').split('/');
  return ROUTES[name] ? { name, param: param ? decodeURIComponent(param) : null } : { name: 'hub', param: null };
}

/* showScreen('detail', 'pixelcraft') — the one way to navigate */
function showScreen(name, param = null, opts = {}) {
  const hash = '#/' + name + (param ? '/' + encodeURIComponent(param) : '');
  if (hash === location.hash) { render({ nav: true }); return; }
  if (opts.replace) { nav.stack[nav.stack.length - 1] = hash; location.replace(hash); }
  else { nav.stack.push(hash); location.hash = hash; }
}

/* Back: use real browser history when we have it, otherwise jump to a sensible parent */
function goBack(fallbackName = 'hub', fallbackParam = null) {
  if (nav.stack.length > 1) history.back();
  else showScreen(fallbackName, fallbackParam, { replace: true });
}

/* Unwind all the way to the hub (used by the Mohar tab, fast-forward and reset) */
function goHome() {
  const n = nav.stack.length - 1;
  if (n > 0) history.go(-n);
  else if (currentRoute().name !== 'hub') showScreen('hub', null, { replace: true });
  else render({ nav: true });
}

window.addEventListener('hashchange', () => {
  const h = location.hash;
  const i = nav.stack.lastIndexOf(h);
  if (i === -1) nav.stack.push(h);       // browser Forward, or a typed URL
  else nav.stack.length = i + 1;         // browser Back (or our own push, already recorded)
  if (h === nav.lastHash) return;        // already on screen
  closeSheet(false);
  render({ nav: true });
});

/* ---------------------------------------------------------------------
   6. SCREENS
   --------------------------------------------------------------------- */
const els = {};

/* render() redraws the current screen from state.
   nav: true  -> this is a navigation (animate in, scroll to top, focus the title)
   nav: false -> an in-place refresh (keep scroll position and keyboard focus) */
function render({ nav: isNav = false, focusTitle = false } = {}) {
  const route = currentRoute();
  const depth = ROUTES[route.name];
  const focusSel = isNav ? null : focusSelector(document.activeElement);
  const scroll = els.screen.scrollTop;

  /* 1. the screen inside the bank app */
  let html;
  if (route.name === 'detail' || route.name === 'cancel') html = renderDetail(route.param);
  else if (route.name === 'add') html = renderAdd();
  else if (route.name === 'calendar') html = renderCalendar();
  else if (route.name === 'checkup') html = renderCheckup();
  else if (route.name === 'review') html = renderReview();
  else if (route.name === 'settings') html = renderSettings();
  else html = renderHub();
  const narrow = ['add', 'calendar', 'checkup', 'review', 'settings'].includes(route.name);
  els.screen.innerHTML = `<div class="view${narrow ? ' narrow' : ''}">${html}</div>`;

  /* 2. overlays on top of the bank app: lock screen or the provider's website */
  let overlay = '';
  if (ui.lockOn) overlay = renderLock();
  else if (route.name === 'cancel') overlay = renderProvider(route.param);
  els.overlay.innerHTML = overlay;
  els.overlay.classList.toggle('on', !!overlay);
  syncInert();

  /* 3. scroll, animation, focus */
  if (isNav) {
    els.screen.scrollTop = 0;
    const view = els.screen.firstElementChild;
    if (nav.lastHash !== null && !reduceMotion()) view.classList.add(depth >= nav.lastDepth ? 'enter-fwd' : 'enter-back');
    nav.lastHash = location.hash; nav.lastDepth = depth;
    focusFirst();
  } else {
    els.screen.scrollTop = scroll;
    const target = focusSel && document.querySelector(focusSel);
    if (target) target.focus({ preventScroll: true });
    else if (focusTitle) focusFirst();
  }

  afterRender();
}
const refresh = opts => render(Object.assign({ nav: false }, opts));

/* Move keyboard focus to the most sensible place after navigating */
function focusFirst() {
  const root = els.overlay.classList.contains('on') ? els.overlay : els.screen;
  const t = root.querySelector('[data-autofocus]') || root.querySelector('h1');
  if (t) t.focus({ preventScroll: true });
}

/* A CSS selector that finds "the same button" again after a re-render */
function focusSelector(el) {
  if (!el || !els.app.contains(el) || el === document.body) return null;
  if (el.id) return '#' + CSS.escape(el.id);
  if (!el.dataset || !el.dataset.action) return null;
  let sel = `[data-action="${el.dataset.action}"]`;
  ['id', 'value', 'from', 'step'].forEach(k => { if (el.dataset[k]) sel += `[data-${k}="${CSS.escape(el.dataset[k])}"]`; });
  return sel;
}

/* Things that happen after every render: number count-up, demo bar, tabs */
function afterRender() {
  /* Any element with data-count="key" data-value="cents" counts from the last value shown under that key */
  if (!ui.lockOn) {
    els.screen.querySelectorAll('[data-count]').forEach(el => {
      const key = el.dataset.count, to = Number(el.dataset.value);
      const from = key in ui.shown ? ui.shown[key] : ('zero' in el.dataset ? 0 : to);
      if (from !== to) countUp(el, from, to);
      ui.shown[key] = to;
    });
    if (currentRoute().name === 'hub' && state.alerts.some(a => a.type === 'confirmed')) ui.sawConfirmation = true;
  }
  updateTabbar();
  updateDemoBar();

  /* First visit to the hub this session: ask for a guess before showing the real total */
  const r = currentRoute();
  if (ui.pendingStop && r.name === 'detail' && r.param === ui.pendingStop && !ui.lockOn) {
    const s = findSub(ui.pendingStop);
    ui.pendingStop = null;
    if (s && s.status === 'active') openSheet(renderExitGuide(s), `How to stop ${s.name}`);
  }
  if (!ui.lockOn && ui.detected && !ui.guessShown && r.name === 'hub' && !els.sheet.innerHTML) {
    ui.guessShown = true;
    ui.guessRevealed = false;
    openSheet(renderGuess(), 'Guess your total');
  }
}

/* Animate a money figure from one value to another */
function countUp(el, from, to) {
  cancelAnimationFrame(el._raf);
  if (reduceMotion()) { el.textContent = eur(to); return; }
  const t0 = performance.now(), dur = 900;
  el.textContent = eur(from);
  const tick = now => {
    const p = Math.min(1, (now - t0) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = eur(Math.round(from + (to - from) * eased));
    if (p < 1) el._raf = requestAnimationFrame(tick);
  };
  el._raf = requestAnimationFrame(tick);
}

/* ===== 6a. HUB — timeline first, then the honest total, then the list ===== */
function renderHub() {
  if (!ui.detected) return renderSkeleton();
  const live = state.subs.filter(isLive);
  const stopped = state.subs.filter(s => s.status === 'stopped');
  const notSubs = state.subs.filter(s => s.status === 'notsub');
  const lump = openLump();

  const head = `
    <h1 class="h-title" tabindex="-1">${t('title')}</h1>
    <div class="top-row">
      <p class="lead">${live.length} ${t('active')} · ${t('todayIs')} ${fmtShort(state.today)}</p>
      ${periodToggle()}
    </div>`;
  const stoppedHtml = stopped.length ? `
    <h2 class="section-title" id="stopped-h">${t('stopped')} <small>${stopped.length}</small></h2>
    <section class="card" aria-labelledby="stopped-h">
      <p class="tiny muted" style="margin:0">Changed your mind? You can rejoin any time.</p>
      <ul class="list stopped">${stopped.map(subRow).join('')}</ul>
    </section>` : '';
  const tail = `
    ${notSubs.length ? `<p class="fine">Not counted as subscriptions: ${notSubs.map(s =>
      `${esc(s.name)} <button class="link-btn" data-action="restoreSub" data-id="${s.id}">Restore</button>`).join(' · ')}</p>` : ''}
    <p class="fine">Subscriptions only — not rent, loans, insurance or bills. We never cancel or block a payment for you.</p>`;

  /* Laptop: things to act on and what's coming up on the left, the money picture on the right */
  if (isWide()) return `${head}${renderAlerts()}
    <div class="cols">
      <div class="col">${renderAttention()}${renderTimeline()}${renderAllList()}${stoppedHtml}</div>
      <div class="col">${renderTotal(lump)}${renderSavings()}${renderMore()}</div>
    </div>${tail}`;

  /* Phone: one column — what needs you first, then what's coming, then the totals */
  return `${head}
    ${renderAlerts()}
    ${renderAttention()}
    ${renderTimeline()}
    ${renderTotal(lump)}
    ${renderSavings()}
    ${renderAllList()}
    ${stoppedHtml}
    ${renderMore()}
    ${tail}`;
}

/* ---------------------------------------------------------------------
   "Needs your attention": one plain card per thing worth acting on,
   each with one obvious button. At most three show until you ask for more.
   --------------------------------------------------------------------- */
function attentionCards() {
  const cards = [];
  state.subs.filter(s => s.status === 'active').forEach(s => { const h = renderUnusedPrompt(s); if (h) cards.push(h); });
  const c = balanceClash();
  if (c) {
    const sub = c.item.sub;
    const name = sub ? esc(sub.name) : 'An app store payment';
    cards.push(`
      <article class="att warn">
        <span class="att-ico">${icon('alert', 20)}</span>
        <div class="att-body">
          <h3 class="att-h">${c.single ? `${eur(c.cents)} charges ${weekday(c.date)}` : `${eur(c.due)} is due by ${weekday(c.date)}`} — your balance is ${eur(state.balanceCents)}</h3>
          <p>${name} on ${fmtShort(c.date)}, before your ${state.incomeLabel} arrives on ${fmtShort(c.income)}.</p>
          <p class="bank-tag">${icon('shield', 13)} Only your bank can see this</p>
          ${sub ? `<div class="att-actions"><button class="btn btn-ghost btn-sm" data-action="open" data-id="${sub.id}">Look at ${name}</button></div>` : ''}
        </div>
      </article>`);
  }
  const lump = openLump();
  if (lump) cards.push(`
      <article class="att">
        <span class="att-ico">${icon('help', 20)}</span>
        <div class="att-body">
          <h3 class="att-h">Which subscription costs ${eur(lump.cents)}?</h3>
          <p>We see ${eur(lump.cents)} from your app store every month, but your bank can't see what it's for. Add it so your total is honest.</p>
          <div class="att-actions"><button class="btn btn-gold btn-sm" data-action="addStart" data-from="lump">Identify this payment</button></div>
        </div>
      </article>`);
  state.subs.filter(s => s.status === 'active' && s.trial && daysBetween(state.today, s.next) <= 7).forEach(s => cards.push(`
      <article class="att warn">
        <span class="att-ico">${icon('radar', 20)}</span>
        <div class="att-body">
          <h3 class="att-h">${esc(s.name)}'s free trial ends ${relDays(s.next)}</h3>
          <p>Then ${eur(s.cents)} a month. Stop before ${fmtShort(addDays(s.next, -1))} and you pay nothing.</p>
          <div class="att-actions"><button class="btn btn-ghost btn-sm" data-action="open" data-id="${s.id}">Review ${esc(s.name)}</button></div>
        </div>
      </article>`));
  const ent = state.subs.filter(s => isLive(s) && s.group === 'entertainment');
  if (ent.length >= 3 && !ui.overlapDismissed) {
    const names = ent.map(s => esc(s.name));
    cards.push(`
      <article class="att">
        <span class="att-ico">${icon('layers', 20)}</span>
        <div class="att-body">
          <h3 class="att-h">You have ${ent.length} entertainment subscriptions</h3>
          <p>${names.slice(0, -1).join(', ')} and ${names[names.length - 1]} — ${eur(ent.reduce((a, s) => a + monthly(s), 0))} a month together.</p>
          <div class="att-actions"><button class="link-btn" data-action="dismissOverlap">OK, got it</button></div>
        </div>
      </article>`);
  }
  return cards;
}
function renderAttention() {
  const cards = attentionCards();
  if (!cards.length) return `
    <h2 class="section-title">${t('attention')}</h2>
    <p class="calm">${icon('check', 18)} ${t('allGood')}</p>`;
  const shown = ui.attAll ? cards : cards.slice(0, 3);
  return `
    <h2 class="section-title" id="att-h">${t('attention')} <small>${cards.length}</small></h2>
    <div aria-labelledby="att-h">${shown.join('')}</div>
    ${cards.length > 3 ? `<button class="show-more" data-action="toggleAttention">${ui.attAll ? 'Show less' : `Show ${cards.length - 3} more`}</button>` : ''}`;
}

/* "You haven't used this app — do you want to cancel it?" */
function renderUnusedPrompt(s) {
  if (s.status !== 'active' || s.nudgeLater) return '';
  const z = zombie(s);
  if (!z) return '';
  const name = esc(s.name);
  const byDays = s.lastOpenedDays >= 45;
  const title = byDays ? `You haven't used ${name} for ${s.lastOpened.replace(/ ago$/, '')}` : `You said you didn't use ${name} last month`;
  const body = byDays ? z.text : `That month cost ${eurShort(s.cents)}.`;
  return `
    <article class="att unused">
      <span class="att-ico">${icon('moon', 20)}</span>
      <div class="att-body">
        <h3 class="att-h">${title}</h3>
        <p>${body} <strong>Do you want to cancel it?</strong></p>
        <div class="att-actions">
          <button class="btn btn-gold btn-sm" data-action="nudgeCancel" data-id="${s.id}">Yes, help me cancel</button>
          <button class="btn btn-ghost btn-sm" data-action="nudgeKeep" data-id="${s.id}">No, I still use it</button>
          <button class="link-btn" data-action="nudgeLater" data-id="${s.id}">Ask me later</button>
        </div>
      </div>
    </article>`;
}

function renderMore() {
  const items = [
    ['calendar', 'calendar', t('calendar'), 'See which days money leaves'],
    ['checkup', 'check', t('checkup'), 'Go through them one by one'],

}

/* One control that reframes every recurring amount: €23 a month ↔ €276 a year */
function periodToggle() {
  return `
    <div class="segctl period" role="group" aria-label="Show amounts">
      <button data-action="setPeriod" data-value="month" aria-pressed="${ui.period === 'month'}">${t('monthly')}</button>
      <button data-action="setPeriod" data-value="year" aria-pressed="${ui.period === 'year'}">${t('yearly')}</button>
    </div>`;
}

/* Confirmation and ghost-charge cards, shown at the top of the hub */
function renderAlerts() {
  return state.alerts.filter(a => !a.dismissed).map(a => {
    const s = findSub(a.subId);
    if (a.type === 'confirmed') return `
      <section class="banner ok pop" aria-label="Cancellation confirmed">
        <span class="b-ico">${icon('check')}</span>
        <div class="grow">
          <h2 class="banner-h">No charge from ${esc(s.name)}.</h2>
          <p>You saved <strong>${eur(a.monthly)}</strong> — <strong>${eur(a.monthly * 12)} a year</strong>.</p>
          <p class="tiny muted">Checked on ${fmtShort(a.date)}, the day it used to charge.</p>
        </div>
        <button class="icon-btn" data-action="dismissAlert" data-id="${a.id}" aria-label="Dismiss">${icon('x', 18)}</button>
      </section>`;
    return `
      <section class="banner bad pop" aria-label="Unexpected charge">
        <span class="b-ico">${icon('alert')}</span>
        <div class="grow">
          <h2 class="banner-h">${esc(s.name)} charged ${eur(a.cents)} <em>after</em> you stopped it.</h2>
          <p>We confirmed no charge on ${fmtShort(s.confirmedOn)}, but ${eur(a.cents)} arrived on ${fmtShort(a.date)}.</p>
          ${a.disputeRef
            ? `<p><span class="pill moss">${icon('check', 12)} Dispute opened · ${a.disputeRef}</span></p>`
            : `<div class="row"><button class="btn btn-danger btn-sm" data-action="dispute" data-id="${a.id}">Dispute this charge</button>
               <button class="link-btn" data-action="open" data-id="${s.id}">Details</button></div>`}
        </div>
      </section>`;
  }).join('');
}

/* "€23.00 charges Friday. Your balance is €18.40." — hub (forSub empty) or one detail screen */
function renderClash(forSub) {
  const c = balanceClash();
  if (!c) return '';
  const sub = c.item.sub || null;
  if (forSub && (!sub || sub.id !== forSub.id)) return '';
  const name = sub ? esc(sub.name) : 'An app store payment';
  const head = c.single
    ? `${eur(c.cents)} charges ${weekday(c.date)}. Your balance is ${eur(state.balanceCents)}.`
    : `${eur(c.due)} is due by ${weekday(c.date)}. Your balance is ${eur(state.balanceCents)}.`;
  const body = c.single
    ? `${name} charges on ${fmtShort(c.date)} — before your ${state.incomeLabel} arrives on ${fmtShort(c.income)}.`
    : `${name} on ${fmtShort(c.date)} is the charge that goes past your balance — before your ${state.incomeLabel} arrives on ${fmtShort(c.income)}.`;
  return `
    <section class="banner warn" aria-label="Balance warning">
      <span class="b-ico">${icon('alert', 18)}</span>
      <div class="grow">
        <h2 class="banner-h">${head}</h2>
        <p>${body}</p>
        <p class="bank-only">${icon('shield', 14)} Only your bank can see this</p>
        ${!forSub && sub ? `<div class="row"><button class="link-btn" data-action="open" data-id="${sub.id}">Look at ${name}</button></div>` : ''}
      </div>
    </section>`;
}

/* Every charge (and reminder) in the next 30 days, nearest first */
function timelineItems() {
  const end = addDays(state.today, 30), items = [];
  state.subs.filter(isLive).forEach(s => {
    for (let d = s.next; d && d <= end; d = addMonths(d, cycleMonths(s))) {
      items.push({ date: d, kind: s.trial && d === s.next ? 'trial' : 'charge', sub: s });
      if (s.status === 'stopping') break;   // once stopped, later charges should not happen
    }
    if (s.status === 'active' && s.remindOn && s.remindOn <= end) items.push({ date: s.remindOn, kind: 'reminder', sub: s });
  });
  state.unknown.filter(u => !u.resolved).forEach(u => {
    for (let d = u.next; d <= end; d = addMonths(d, 1)) items.push({ date: d, kind: 'unknown', lump: u });
  });
  const order = { reminder: 0, trial: 1, charge: 2, unknown: 3 };
  return items.sort((a, b) => a.date.localeCompare(b.date) || order[a.kind] - order[b.kind]);
}

function renderTimeline() {
  const items = timelineItems();
  const due = items.reduce((sum, it) => {
    if (it.kind === 'unknown') return sum + it.lump.cents;
    if ((it.kind === 'charge' || it.kind === 'trial') && it.sub.status === 'active') return sum + it.sub.cents;
    return sum;
  }, 0);
  const shown = ui.tlAll ? items : items.slice(0, 4);
  return `
    <h2 class="section-title" id="tl-h">${t('comingUp')} <small>${t('next30').toLowerCase()} · ${eur(due)}</small></h2>
    <section class="card tl-card" aria-labelledby="tl-h">
      ${state.notifyAll ? '' : `<p class="tiny muted" style="margin:0 0 4px">Warnings are switched off in Settings.</p>`}
      ${items.length ? `<ol class="timeline">${shown.map(timelineRow).join('')}</ol>`
                     : `<p class="empty">Nothing charges in the next 30 days.</p>`}
      ${items.length > 4 ? `<button class="show-more" data-action="toggleTimeline">${ui.tlAll ? 'Show less' : `Show all ${items.length} charges`}</button>` : ''}
    </section>`;
}

function timelineRow(it) {
  const d = toDate(it.date), n = daysBetween(state.today, it.date);
  const date = `<span class="tl-date" aria-hidden="true"><span>${wdShort(d)}</span><b>${d.getDate()}</b><span>${moShort(d)}</span></span>`;
  let cls = '', name, meta, amt = '', action;

  if (it.kind === 'unknown') {
    cls = 'unknown';
    name = it.lump.label;
    meta = `Unidentified · ${relDays(it.date)} · tap to name it`;
    amt = eur(it.lump.cents);
    action = 'data-action="addStart" data-from="lump"';
  } else {
    const s = it.sub;
    action = `data-action="open" data-id="${s.id}"`;
    name = esc(s.name);
    if (it.kind === 'reminder') {
      cls = 'reminder';
      name = `Decide on ${esc(s.name)}`;
      meta = `Your reminder · it charges ${relDays(s.next)}`;
    } else if (s.status === 'stopping') {
      cls = 'is-stopping';
      meta = `Stopping — we'll check this day`;
      amt = eur(s.cents);
    } else {
      cls = (n <= warnWindow(s) ? 'urgent' : '') + (it.kind === 'trial' ? ' trial' : '');
      meta = it.kind === 'trial' ? `Free trial ends ${relDays(it.date)} → first charge`
                                 : `${chLabel(s.channel)}${s.cycle === 'yearly' ? ' · yearly' : ''} · ${relDays(it.date)}`;
      amt = eur(s.cents);
    }
  }
  return `<li><button class="tl-row ${cls}" ${action} aria-label="${fmtShort(it.date)}: ${name.replace(/"/g, '&quot;')}, ${meta}${amt ? ', ' + amt : ''}${it.sub && it.kind !== 'reminder' && it.sub.status === 'active' ? ', ' + warnText(it.sub) : ''}">
      ${date}<span class="rail" aria-hidden="true"><i class="dot"></i></span>
      <span class="tl-body"><span class="tl-name">${name}</span><span class="tl-meta">${meta}${it.sub && it.kind !== 'reminder' && it.sub.status === 'active' ? bellTag(it.sub) : ''}</span></span>
      <span class="tl-amt">${amt}</span></button></li>`;
}

/* The honest total with its channel-segmented bar; follows the monthly/yearly toggle */
function renderTotal(lump) {
  const total = totalMonthly();
  const live = state.subs.filter(isLive);
  const segs = segments();
  const unit = perUnit();
  const manualCount = live.filter(s => s.source === 'manual').length;
  const honesty = lump
    ? `This is only what your bank can see. One app store payment of ${eur(lump.cents)} isn't identified yet.`
    : manualCount ? `Complete picture — includes ${manualCount} subscription${manualCount > 1 ? 's' : ''} you added yourself.`
                  : `This is what your bank can see on your card and PayPal.`;
  const srSegs = segs.map(g => `${segLabel(g)} ${eur(inPeriod(g.cents))}`).join(', ');

  return `
    <section class="total" aria-labelledby="total-h">
      <button class="total-btn" data-action="toggleBreakdown" aria-expanded="${ui.breakdownOpen}" aria-controls="breakdown">
        <span class="eyebrow" id="total-h">${t('youPay')}</span>
        <span class="total-num"><span data-count="total" data-value="${inPeriod(total)}">${eur(inPeriod(total))}</span><small>/ ${unit}</small></span>
        <span class="total-sub">${live.length} ${t('subsCount')} · ${ui.period === 'year' ? eur(total) + ' ' + t('aMonth') : eur(total * 12) + ' ' + t('aYear')}</span>
        <span class="segbar" aria-hidden="true">${segs.map(g => `<span class="seg" style="flex-grow:${g.cents};background:${g.color}"></span>`).join('')}</span>

}

/* Savings meter: always on the hub, celebratory once something is stopped */
function renderSavings() {

/* One row in the subscription lists */
function subRow(s) {
  /* One badge at most, the most important one, so rows stay easy to scan */
  const rise = priceRise(s);
  const tag =
      s.ghost ? '<span class="pill danger">Charged after stopping</span>'
    : s.status === 'active' && s.trial ? `<span class="pill gold">Trial ends ${fmtDM(s.next)}</span>`
    : zombie(s) ? '<span class="pill gold">Not used lately</span>'
    : rise && isLive(s) ? `<span class="pill gold">+${eur(rise.diff)} since ${rise.month}</span>`
    : s.status === 'active' && s.decision === 'unsure' ? '<span class="pill gold">Deciding</span>'
    : s.status === 'active' && s.decision === 'keep' ? '<span class="pill moss">Keeping</span>'
    : s.source === 'manual' ? '<span class="pill">Added by you</span>'
    : '';
  let meta;
  if (s.status === 'stopping') meta = `<span class="pill moss">Stopping — we'll check on ${fmtDM(s.checkOn)}</span>`;
  else if (s.status === 'stopped') meta = `Stopped · no charge on ${fmtDM(s.confirmedOn)} ✓`;
  else if (s.trial) meta = `${chLabel(s.channel)} · ${t('trialEnds').toLowerCase()} ${fmtShort(s.next)}`;
  else meta = `${chLabel(s.channel)} · ${t('nextWord')} ${fmtShort(s.next)}`;

  let amt;
  if (s.trial && s.status === 'active') amt = `€0.00<small>then ${eur(inPeriod(s.cents))}/${ui.period === 'year' ? 'yr' : 'mo'}</small>`;
  else amt = `${eur(inPeriod(monthly(s)))}<small>/ ${perUnit()}${s.cycle === 'yearly' && ui.period === 'month' ? ' · billed yearly' : ''}</small>`;

  const row = `<button class="sub-row" data-action="open" data-id="${s.id}">
      ${logo(s)}
      <span class="sub-main"><span class="sub-name">${esc(s.name)} ${tag}</span><span class="sub-meta">${meta}</span></span>
      <span class="sub-amt">${amt}</span>
    </button>`;
  return s.status === 'stopped'
    ? `<li class="stopped-li">${row}<button class="btn btn-ghost btn-sm" data-action="rejoin" data-id="${s.id}" aria-label="Rejoin ${esc(s.name)}">Rejoin</button></li>`
    : `<li>${row}</li>`;
}

/* Trial radar: a live countdown to the moment a free trial becomes a paid charge */
function renderRadar(s) {
  const span = Math.max(1, daysBetween(s.trialStart || addMonths(s.next, -1), s.next));
  const used = Math.min(100, Math.max(0, Math.round(daysBetween(s.trialStart || addMonths(s.next, -1), state.today) / span * 100)));
  const left = Math.max(0, n0(daysBetween(state.today, s.next)));
  return `
    <section class="radar" aria-labelledby="radar-h">
      <div class="radar-ring" style="--p:${used}" aria-hidden="true"><span>${left}<small>${left === 1 ? 'day' : 'days'}</small></span></div>
      <div class="grow">
        <p class="eyebrow">${icon('radar', 13)} Trial radar</p>
        <h2 class="radar-h" id="radar-h">Becomes ${eur(s.cents)} a month in</h2>
        <p class="radar-count" data-countdown="${s.next}" aria-live="off">${countdownText(s.next)}</p>
        <p class="small" style="margin:0">Stop before ${fmtLong(addDays(s.next, -1))} and you pay nothing. ${used}% of the trial is used.</p>
      </div>
    </section>`;
}
const n0 = n => n < 0 ? 0 : n;


/* Annual early warning: why yearly subscriptions are flagged 14 days ahead */
function renderAnnualNote(s) {
  const warnOn = addDays(s.next, -14);
  return `

}

/* "How we recognised this" — the raw statement lines collapsing into one subscription */

      <div class="recog" id="rec-${s.id}">
